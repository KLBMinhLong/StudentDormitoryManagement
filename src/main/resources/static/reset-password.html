<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - Ký Túc Xá Sinh Viên</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/ui/theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0EA5A5',
                        'primary-hover': '#0B8F8F',
                        secondary: '#3B82F6',
                        'bg-page': '#F8FAFC',
                        'bg-card': '#FFFFFF',
                        'text-main': '#0F172A',
                        'text-muted': '#475569',
                        border: '#E2E8F0',
                        danger: '#DC2626',
                        success: '#16A34A'
                    },
                    boxShadow: { soft: '0 4px 12px rgba(15, 23, 42, 0.06)' },
                    borderRadius: { base: '12px' },
                    fontFamily: {
                        heading: ['Be Vietnam Pro', 'sans-serif'],
                        body: ['Inter', 'sans-serif']
                    }
                }
            }
        };
    </script>
</head>

<body class="font-body text-text-main bg-bg-page min-h-screen flex items-center justify-center px-4">
    <!-- Main Container -->
    <div class="w-full max-w-md">
        <!-- Logo/Header Section -->
        <div class="text-center mb-8">
            <div class="inline-block mb-4 p-3 bg-primary/10 rounded-full text-primary">
                <i class="fas fa-building text-2xl"></i>
            </div>
            <h1 class="font-heading text-2xl font-bold text-text-main">Ký Túc Xá Sinh Viên</h1>
            <p class="text-text-muted text-sm mt-2">Đặt lại mật khẩu</p>
        </div>

        <!-- Reset Password Card -->
        <div class="bg-bg-card rounded-base border border-border shadow-soft p-8 mb-6">
            <h2 class="font-heading text-xl font-bold text-text-main mb-2">Đặt lại mật khẩu</h2>
            <p class="text-text-muted text-sm mb-6">Vui lòng nhập mật khẩu mới của bạn</p>

            <form id="resetPasswordForm" class="space-y-4" novalidate>
                <!-- New Password Field -->
                <div>
                    <label for="newPassword" class="block text-sm font-medium text-text-main mb-2">
                        Mật khẩu mới
                        <span class="text-danger">*</span>
                    </label>
                    <div class="relative">
                        <input 
                            id="newPassword" 
                            type="password" 
                            required 
                            placeholder="Nhập mật khẩu mới"
                            class="w-full px-4 py-3 pr-12 rounded-base border border-border text-text-main placeholder-text-muted focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors"
                        />
                        <button 
                            type="button" 
                            id="toggleNewPassword"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-text-muted hover:text-text-main transition-colors"
                            aria-label="Hiện/ẩn mật khẩu"
                        >
                            <i id="newPasswordEyeIcon" class="fas fa-eye-slash text-lg"></i>
                        </button>
                    </div>
                    <div id="newPasswordError" class="text-danger text-xs mt-1 hidden"></div>
                    <p class="text-text-muted text-xs mt-1">Mật khẩu phải có ít nhất 6 ký tự</p>
                </div>

                <!-- Confirm Password Field -->
                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-text-main mb-2">
                        Xác nhận mật khẩu
                        <span class="text-danger">*</span>
                    </label>
                    <div class="relative">
                        <input 
                            id="confirmPassword" 
                            type="password" 
                            required 
                            placeholder="Nhập lại mật khẩu"
                            class="w-full px-4 py-3 pr-12 rounded-base border border-border text-text-main placeholder-text-muted focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors"
                        />
                        <button 
                            type="button" 
                            id="toggleConfirmPassword"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-text-muted hover:text-text-main transition-colors"
                            aria-label="Hiện/ẩn mật khẩu"
                        >
                            <i id="confirmPasswordEyeIcon" class="fas fa-eye-slash text-lg"></i>
                        </button>
                    </div>
                    <div id="confirmPasswordError" class="text-danger text-xs mt-1 hidden"></div>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="submitBtn"
                    class="w-full px-4 py-3 mt-6 rounded-base bg-primary hover:bg-primary-hover text-white font-medium transition-colors duration-200 flex items-center justify-center gap-2"
                >
                    <span id="submitText">Đặt lại mật khẩu</span>
                    <span id="spinner" class="hidden">
                        <svg class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                        </svg>
                    </span>
                </button>

                <!-- Message Alert -->
                <div id="message" class="hidden mt-4 rounded-base px-4 py-3 text-sm border"></div>
            </form>

            <!-- Back to Login Link -->
            <p class="text-center text-text-muted text-sm mt-6">
                <a href="/login" class="text-primary hover:text-primary-hover font-medium transition-colors">
                    Quay lại đăng nhập
                </a>
            </p>
        </div>
    </div>

    <script>
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.body.innerHTML = `
                <div class="w-full max-w-md">
                    <div class="bg-bg-card rounded-base border border-border shadow-soft p-8 text-center">
                        <h2 class="font-heading text-xl font-bold text-text-main mb-2">Liên kết lỗi</h2>
                        <p class="text-text-muted text-sm mb-6">Liên kết đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.</p>
                        <a href="/login" class="inline-block px-6 py-2 rounded-base bg-primary hover:bg-primary-hover text-white font-medium">
                            Quay lại đăng nhập
                        </a>
                    </div>
                </div>
            `;
        } else {
            // ============ PASSWORD TOGGLE ============
            const newPasswordInput = document.getElementById('newPassword');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const toggleNewPasswordBtn = document.getElementById('toggleNewPassword');
            const toggleConfirmPasswordBtn = document.getElementById('toggleConfirmPassword');
            const newPasswordEyeIcon = document.getElementById('newPasswordEyeIcon');
            const confirmPasswordEyeIcon = document.getElementById('confirmPasswordEyeIcon');

            toggleNewPasswordBtn.addEventListener('click', (e) => {
                e.preventDefault();
                const isPassword = newPasswordInput.type === 'password';
                newPasswordInput.type = isPassword ? 'text' : 'password';
                 newPasswordEyeIcon.classList.toggle('fa-eye');
                 newPasswordEyeIcon.classList.toggle('fa-eye-slash');
            });

            toggleConfirmPasswordBtn.addEventListener('click', (e) => {
                e.preventDefault();
                const isPassword = confirmPasswordInput.type === 'password';
                confirmPasswordInput.type = isPassword ? 'text' : 'password';
                    confirmPasswordEyeIcon.classList.toggle('fa-eye');
                    confirmPasswordEyeIcon.classList.toggle('fa-eye-slash');
            });

            // ============ RESET PASSWORD FORM ============
            const form = document.getElementById('resetPasswordForm');
            const message = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');
            const newPasswordError = document.getElementById('newPasswordError');
            const confirmPasswordError = document.getElementById('confirmPasswordError');

            function showMessage(type, text) {
                message.className = 'mt-4 rounded-base px-4 py-3 text-sm border';
                if (type === 'error') {
                    message.classList.add('bg-red-50', 'text-danger', 'border-red-100');
                } else {
                    message.classList.add('bg-green-50', 'text-success', 'border-green-100');
                }
                message.textContent = text;
                message.classList.remove('hidden');
            }

            function hideErrors() {
                newPasswordError.classList.add('hidden');
                confirmPasswordError.classList.add('hidden');
            }

            function setLoading(isLoading) {
                submitBtn.disabled = isLoading;
                document.getElementById('submitText').classList.toggle('hidden', isLoading);
                document.getElementById('spinner').classList.toggle('hidden', !isLoading);
            }

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                hideErrors();

                const newPassword = newPasswordInput.value.trim();
                const confirmPassword = confirmPasswordInput.value.trim();

                // Validation
                if (!newPassword) {
                    newPasswordError.textContent = 'Mật khẩu mới không được để trống';
                    newPasswordError.classList.remove('hidden');
                    return;
                }

                if (newPassword.length < 6) {
                    newPasswordError.textContent = 'Mật khẩu phải có ít nhất 6 ký tự';
                    newPasswordError.classList.remove('hidden');
                    return;
                }

                if (!confirmPassword) {
                    confirmPasswordError.textContent = 'Xác nhận mật khẩu không được để trống';
                    confirmPasswordError.classList.remove('hidden');
                    return;
                }

                if (newPassword !== confirmPassword) {
                    confirmPasswordError.textContent = 'Mật khẩu xác nhận không khớp';
                    confirmPasswordError.classList.remove('hidden');
                    return;
                }

                setLoading(true);

                const payload = {
                    token: token,
                    newPassword: newPassword,
                    confirmPassword: confirmPassword
                };

                try {
                    const response = await fetch('/api/v1/auth/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.message || 'Đặt lại mật khẩu thất bại');
                    }

                    showMessage('success', 'Mật khẩu đã được đặt lại thành công. Đang chuyển hướng đến trang đăng nhập...');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } catch (error) {
                    setLoading(false);
                    showMessage('error', error.message || 'Có lỗi xảy ra');
                }
            });
        }
    </script>
</body>

</html>
