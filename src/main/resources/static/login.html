<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ký Túc Xá Sinh Viên - Đăng nhập</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/ui/theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0EA5A5',
                        'primary-hover': '#0B8F8F',
                        secondary: '#3B82F6',
                        'bg-page': '#F8FAFC',
                        'bg-card': '#FFFFFF',
                        'text-main': '#0F172A',
                        'text-muted': '#475569',
                        border: '#E2E8F0',
                        danger: '#DC2626',
                        success: '#16A34A'
                    },
                    boxShadow: { soft: '0 4px 12px rgba(15, 23, 42, 0.06)' },
                    borderRadius: { base: '12px' },
                    fontFamily: {
                        heading: ['Be Vietnam Pro', 'sans-serif'],
                        body: ['Inter', 'sans-serif']
                    }
                }
            }
        };
    </script>
</head>

<body class="font-body text-text-main bg-bg-page min-h-screen flex items-center justify-center px-4">
    <!-- Main Container -->
    <div class="w-full max-w-md">
        <!-- Logo/Header Section -->
        <div class="text-center mb-8">
            <div class="inline-block mb-4 p-3 bg-primary/10 rounded-full text-primary">
                <i class="fas fa-building text-2xl"></i>
            </div>
            <h1 class="font-heading text-2xl font-bold text-text-main">Ký Túc Xá Sinh Viên</h1>
            <p class="text-text-muted text-sm mt-2">Hệ thống quản lý ký túc xá</p>
        </div>

        <!-- Login Card -->
        <div class="bg-bg-card rounded-base border border-border shadow-soft p-8 mb-6">
            <h2 class="font-heading text-xl font-bold text-text-main mb-2">Đăng nhập</h2>
            <p class="text-text-muted text-sm mb-6">Vui lòng nhập thông tin để tiếp tục</p>

            <form id="loginForm" class="space-y-4" novalidate>
                <!-- Username Field -->
                <div>
                    <label for="username" class="block text-sm font-medium text-text-main mb-2">
                        Tên đăng nhập
                        <span class="text-danger">*</span>
                    </label>
                    <input 
                        id="username" 
                        type="text" 
                        required 
                        placeholder="Nhập tên đăng nhập, email hoặc mã sinh viên"
                        class="w-full px-4 py-3 rounded-base border border-border text-text-main placeholder-text-muted focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors"
                    />
                    <div id="usernameError" class="text-danger text-xs mt-1 hidden"></div>
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-sm font-medium text-text-main mb-2">
                        Mật khẩu
                        <span class="text-danger">*</span>
                    </label>
                    <div class="relative">
                        <input 
                            id="password" 
                            type="password" 
                            required 
                            placeholder="Nhập mật khẩu"
                            class="w-full px-4 py-3 pr-12 rounded-base border border-border text-text-main placeholder-text-muted focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors"
                        />
                        <button 
                            type="button" 
                            id="togglePassword"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-text-muted hover:text-text-main transition-colors"
                            aria-label="Hiện/ẩn mật khẩu"
                        >
                            <i id="eyeIcon" class="fas fa-eye-slash text-lg"></i>
                        </button>
                    </div>
                    <div id="passwordError" class="text-danger text-xs mt-1 hidden"></div>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="submitBtn"
                    class="w-full px-4 py-3 mt-6 rounded-base bg-primary hover:bg-primary-hover text-white font-medium transition-colors duration-200 flex items-center justify-center gap-2"
                >
                    <span id="submitText">Đăng nhập</span>
                    <span id="spinner" class="hidden">
                        <!-- Loading spinner -->
                        <svg class="w-4 h-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </span>
                </button>

                <!-- Message Alert -->
                <div id="message" class="hidden mt-4 rounded-base px-4 py-3 text-sm border"></div>
            </form>

            <!-- Forgot Password Link -->
            <p class="text-center text-text-muted text-sm mt-6">
                <button 
                    type="button" 
                    id="forgotPasswordBtn"
                    class="text-primary hover:text-primary-hover font-medium transition-colors underline"
                >
                    Quên mật khẩu?
                </button>
            </p>
        </div>

        <!-- Register Link -->
        <p class="text-center text-text-muted text-sm">
            Chưa có tài khoản? 
            <a href="/register" class="text-secondary hover:text-secondary font-medium transition-colors">
                Đăng ký ngay
            </a>
        </p>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-bg-card rounded-base border border-border shadow-soft max-w-sm w-full p-8 animate-in">
            <!-- Modal Header -->
            <div class="flex items-center justify-between mb-6">
                <h3 class="font-heading text-lg font-bold text-text-main">Quên mật khẩu</h3>
                <button 
                    type="button" 
                    id="closeForgotPasswordModal"
                    class="text-text-muted hover:text-text-main transition-colors text-lg"
                    aria-label="Đóng"
                >
                    <i class="fas fa-times text-lg"></i>
                </button>
            </div>

            <!-- Modal Description -->
            <p class="text-text-muted text-sm mb-6">
                Nhập email đăng ký của bạn, chúng tôi sẽ gửi hướng dẫn đặt lại mật khẩu qua email.
            </p>

            <!-- Forgot Password Form -->
            <form id="forgotPasswordForm" class="space-y-4" method="post">
                <div>
                    <label for="forgotEmail" class="block text-sm font-medium text-text-main mb-2">
                        Email
                        <span class="text-danger">*</span>
                    </label>
                    <input 
                        id="forgotEmail" 
                        type="email" 
                        required 
                        placeholder="Nhập email của bạn"
                        class="w-full px-4 py-3 rounded-base border border-border text-text-main placeholder-text-muted focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors"
                    />
                    <div id="forgotEmailError" class="text-danger text-xs mt-1 hidden"></div>
                </div>

                <!-- Modal Message -->
                <div id="forgotPasswordMessage" class="hidden mt-4 rounded-base px-4 py-3 text-sm border"></div>

                <!-- Modal Buttons -->
                <div class="flex gap-3 mt-6">
                    <button 
                        type="button" 
                        id="cancelForgotPasswordBtn"
                        class="flex-1 px-4 py-2 rounded-base border border-border text-text-main hover:bg-bg-page transition-colors font-medium"
                    >
                        Hủy
                    </button>
                    <button 
                        type="submit"
                        id="submitForgotPasswordBtn"
                        class="flex-1 px-4 py-2 rounded-base bg-primary hover:bg-primary-hover text-white font-medium transition-colors flex items-center justify-center gap-2"
                    >
                        <span id="forgotButtonText">Gửi</span>
                        <span id="forgotSpinner" class="hidden">
                            <!-- Loading spinner -->
                            <svg class="w-4 h-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                        </span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Redirect if already logged in
        const token = localStorage.getItem('dormitory_access_token');
        if (token) {
            window.location.href = '/home';
        }

        // ============ PASSWORD TOGGLE ============
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePasswordBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.classList.toggle('fa-eye');
            eyeIcon.classList.toggle('fa-eye-slash');
        });

        // ============ LOGIN FORM ============
        const form = document.getElementById('loginForm');
        const message = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');
        const usernameInput = document.getElementById('username');
        const usernameError = document.getElementById('usernameError');
        const passwordError = document.getElementById('passwordError');

        function showMessage(type, text) {
            message.className = 'mt-4 rounded-base px-4 py-3 text-sm';
            if (type === 'error') {
                message.classList.add('bg-red-50', 'text-danger', 'border', 'border-red-100');
            } else {
                message.classList.add('bg-green-50', 'text-success', 'border', 'border-green-100');
            }
            message.textContent = text;
            message.classList.remove('hidden');
        }

        function hideErrors() {
            usernameError.classList.add('hidden');
            passwordError.classList.add('hidden');
        }

        function setLoading(isLoading) {
            submitBtn.disabled = isLoading;
            document.getElementById('submitText').classList.toggle('hidden', isLoading);
            document.getElementById('spinner').classList.toggle('hidden', !isLoading);
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            hideErrors();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            // Validation
            if (!username) {
                usernameError.textContent = 'Tên đăng nhập không được để trống';
                usernameError.classList.remove('hidden');
                return;
            }

            if (!password) {
                passwordError.textContent = 'Mật khẩu không được để trống';
                passwordError.classList.remove('hidden');
                return;
            }

            if (password.length < 6) {
                passwordError.textContent = 'Mật khẩu phải có ít nhất 6 ký tự';
                passwordError.classList.remove('hidden');
                return;
            }

            setLoading(true);

            const payload = {
                username: username,
                password: password
            };

            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Đăng nhập thất bại');
                }

                localStorage.setItem('dormitory_access_token', data.result.accessToken);

                const roles = Array.isArray(data.result?.user?.roles) ? data.result.user.roles : [];
                const isAdmin = roles.includes('ROLE_ADMIN');

                showMessage('success', 'Đăng nhập thành công, đang chuyển trang...');
                setTimeout(() => {
                    window.location.href = isAdmin ? '/admin' : '/home';
                }, 400);
            } catch (error) {
                setLoading(false);
                showMessage('error', error.message || 'Có lỗi xảy ra');
            }
        });

        // ============ FORGOT PASSWORD MODAL ============
        const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
        const forgotPasswordModal = document.getElementById('forgotPasswordModal');
        const closeForgotPasswordModal = document.getElementById('closeForgotPasswordModal');
        const cancelForgotPasswordBtn = document.getElementById('cancelForgotPasswordBtn');
        const forgotPasswordForm = document.getElementById('forgotPasswordForm');
        const forgotPasswordMessage = document.getElementById('forgotPasswordMessage');
        const forgotEmailInput = document.getElementById('forgotEmail');
        const forgotEmailError = document.getElementById('forgotEmailError');
        const submitForgotPasswordBtn = document.getElementById('submitForgotPasswordBtn');

        function openForgotPasswordModal() {
            forgotPasswordModal.classList.remove('hidden');
            forgotPasswordForm.reset();
            forgotEmailError.classList.add('hidden');
            forgotPasswordMessage.classList.add('hidden');
        }

        function closeForgotModal() {
            forgotPasswordModal.classList.add('hidden');
        }

        function showForgotMessage(type, text) {
            forgotPasswordMessage.className = 'mt-4 rounded-base px-4 py-3 text-sm border';
            if (type === 'error') {
                forgotPasswordMessage.classList.add('bg-red-50', 'text-danger', 'border-red-100');
            } else {
                forgotPasswordMessage.classList.add('bg-green-50', 'text-success', 'border-green-100');
            }
            forgotPasswordMessage.textContent = text;
            forgotPasswordMessage.classList.remove('hidden');
        }

        function setForgotLoading(isLoading) {
            submitForgotPasswordBtn.disabled = isLoading;
            document.getElementById('forgotButtonText').classList.toggle('hidden', isLoading);
            document.getElementById('forgotSpinner').classList.toggle('hidden', !isLoading);
        }

        forgotPasswordBtn.addEventListener('click', (e) => {
            e.preventDefault();
            openForgotPasswordModal();
        });

        closeForgotPasswordModal.addEventListener('click', closeForgotModal);
        cancelForgotPasswordBtn.addEventListener('click', closeForgotModal);

        // Close modal when clicking outside
        forgotPasswordModal.addEventListener('click', (e) => {
            if (e.target === forgotPasswordModal) {
                closeForgotModal();
            }
        });

        forgotPasswordForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            forgotEmailError.classList.add('hidden');

            const email = forgotEmailInput.value.trim();

            // Validation
            if (!email) {
                forgotEmailError.textContent = 'Email không được để trống';
                forgotEmailError.classList.remove('hidden');
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                forgotEmailError.textContent = 'Email không hợp lệ';
                forgotEmailError.classList.remove('hidden');
                return;
            }

            setForgotLoading(true);

            try {
                const response = await fetch('/api/v1/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Không thể gửi yêu cầu đặt lại mật khẩu');
                }

                showForgotMessage('success', data.message || 'Hướng dẫn đặt lại mật khẩu đã được gửi về email của bạn. Vui lòng kiểm tra email trong vài phút.');
                
                setTimeout(() => {
                    closeForgotModal();
                }, 2000);
            } catch (error) {
                setForgotLoading(false);
                showForgotMessage('error', error.message || 'Có lỗi xảy ra');
            }
        });
    </script>
</body>

</html>
