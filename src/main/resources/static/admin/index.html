<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTX - Bảng điều khiển quản trị</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/ui/theme.css">
    <script src="/ui/admin-sidebar.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0EA5A5',
                        'primary-hover': '#0B8F8F',
                        secondary: '#3B82F6',
                        'bg-page': '#F8FAFC',
                        'bg-card': '#FFFFFF',
                        'text-main': '#0F172A',
                        'text-muted': '#475569',
                        border: '#E2E8F0',
                        warning: '#D97706'
                    },
                    boxShadow: { soft: '0 4px 12px rgba(15, 23, 42, 0.06)' },
                    borderRadius: { base: '12px' },
                    fontFamily: {
                        heading: ['Be Vietnam Pro', 'sans-serif'],
                        body: ['Inter', 'sans-serif']
                    }
                }
            }
        };
    </script>
</head>

<body class="font-body text-text-main bg-bg-page min-h-screen">
    <div id="adminLayout" class="max-w-[1200px] mx-auto p-4 md:p-6 min-h-screen">
        <div class="admin-grid grid grid-cols-1 md:grid-cols-[260px_1fr] gap-6 min-h-[calc(100vh-3rem)]">
            <div id="adminSidebarMount"></div>

            <main class="space-y-6">

                <section class="rounded-base bg-bg-card border border-border shadow-soft p-6">
                    <h2 class="font-heading text-2xl">Tổng quan quản trị</h2>
                    <p class="text-text-muted mt-2">Theo dõi nhanh số lượng tòa nhà, tổng số tầng và số lượng phòng trong hệ thống.</p>

                    <div class="mt-6 grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div class="rounded-base border border-border p-4">
                            <p class="text-xs text-text-muted">Số tòa nhà</p>
                            <p id="buildingCount" class="mt-1 text-2xl font-heading">0</p>
                        </div>
                        <div class="rounded-base border border-border p-4">
                            <p class="text-xs text-text-muted">Tổng số tầng</p>
                            <p id="floorsCount" class="mt-1 text-2xl font-heading">0</p>
                        </div>
                        <div class="rounded-base border border-border p-4">
                            <p class="text-xs text-text-muted">Số phòng</p>
                            <p id="roomCount" class="mt-1 text-2xl font-heading">0</p>
                        </div>
                        <div class="rounded-base border border-border p-4 bg-orange-50">
                            <p class="text-xs text-text-muted">Vai trò</p>
                            <p id="adminRoles" class="mt-1 font-medium text-warning">...</p>
                        </div>
                    </div>
                </section>

                <section class="rounded-base bg-bg-card border border-border shadow-soft p-6">
                    <div class="flex items-center justify-between gap-3">
                        <h3 class="font-heading text-xl">Danh sách tòa nhà</h3>
                        <a href="/admin/buildings" class="text-sm text-primary hover:underline">Mở trang CRUD tòa nhà</a>
                    </div>

                    <div class="mt-4 overflow-x-auto rounded-base border border-border">
                        <table class="w-full min-w-[680px]">
                            <thead>
                                <tr class="bg-slate-50 border-b border-border text-text-muted text-left text-xs uppercase tracking-wide font-medium">
                                    <th class="px-4 py-3 w-16">ID</th>
                                    <th class="px-4 py-3">Tên tòa</th>
                                    <th class="px-4 py-3 w-32">Số tầng</th>
                                    <th class="px-4 py-3">Mô tả</th>
                                </tr>
                            </thead>
                            <tbody id="buildingBody" class="divide-y divide-border"></tbody>
                        </table>
                    </div>
                    <div id="buildingPagination" class="mt-4 flex items-center justify-end gap-2"></div>
                </section>
            </main>
        </div>
    </div>

    <script>
        const ITEMS_PER_PAGE = 10;
        const token = localStorage.getItem('dormitory_access_token');

        let buildingItems = [];
        let buildingPage = 1;

        if (!token) {
            window.location.href = '/login';
        }

        function initAdminSidebar() {
            if (!window.AdminSidebar || typeof window.AdminSidebar.mount !== 'function') {
                window.setTimeout(initAdminSidebar, 50);
                return;
            }

            window.AdminSidebar.mount({
                mountId: 'adminSidebarMount',
                active: 'dashboard',
                caption: 'Quản trị hệ thống'
            });
        }

        initAdminSidebar();

        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function paginate(items, page) {
            const totalPages = Math.max(1, Math.ceil(items.length / ITEMS_PER_PAGE));
            const safePage = Math.min(Math.max(page, 1), totalPages);
            const start = (safePage - 1) * ITEMS_PER_PAGE;
            return {
                safePage,
                totalPages,
                data: items.slice(start, start + ITEMS_PER_PAGE)
            };
        }

        function renderPagination(container, page, totalPages, onChange) {
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            const start = Math.max(1, page - 2);
            const end = Math.min(totalPages, page + 2);
            let pageButtons = '';
            for (let i = start; i <= end; i++) {
                const active = i === page;
                pageButtons += `<button class="rounded-base border px-3 py-1.5 text-sm ${active ? 'border-primary bg-primary text-white' : 'border-border hover:bg-slate-50'}" data-page="${i}">${i}</button>`;
            }

            const startResult = (page - 1) * ITEMS_PER_PAGE + 1;
            const endResult = Math.min(page * ITEMS_PER_PAGE, buildingItems.length);

            container.innerHTML = `
                <p class="text-sm text-text-muted">Hiển thị ${startResult}-${endResult} trên tổng số ${buildingItems.length} kết quả</p>
                <div class="flex flex-wrap items-center gap-2">
                    <button class="rounded-base border border-border px-3 py-1.5 text-sm ${page === 1 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-slate-50'}" ${page === 1 ? 'disabled' : ''} data-page="${page - 1}">Trước</button>
                    ${pageButtons}
                    <button class="rounded-base border border-border px-3 py-1.5 text-sm ${page === totalPages ? 'opacity-50 cursor-not-allowed' : 'hover:bg-slate-50'}" ${page === totalPages ? 'disabled' : ''} data-page="${page + 1}">Sau</button>
                </div>
            `;

            container.querySelectorAll('button[data-page]').forEach((btn) => {
                btn.addEventListener('click', () => {
                    onChange(Number(btn.dataset.page));
                    document.querySelector('main')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            });
        }

        function renderBuildings(page) {
            const body = document.getElementById('buildingBody');
            const pagination = document.getElementById('buildingPagination');
            const paged = paginate(buildingItems, page);
            buildingPage = paged.safePage;

            if (!paged.data.length) {
                body.innerHTML = '<tr><td colspan="4" class="px-4 py-3 text-sm text-text-muted">Chưa có tòa nhà.</td></tr>';
                pagination.innerHTML = '';
                return;
            }

            body.innerHTML = paged.data.map((item) => `
                <tr>
                    <td class="px-4 py-3 text-sm">${item.id ?? '-'}</td>
                    <td class="px-4 py-3 text-sm font-medium">${escHtml(item.name || '-')}</td>
                    <td class="px-4 py-3 text-sm">${Number(item.totalFloors) || 0}</td>
                    <td class="px-4 py-3 text-sm text-text-muted">${escHtml(item.description || 'Chưa cập nhật')}</td>
                </tr>
            `).join('');

            renderPagination(pagination, buildingPage, paged.totalPages, renderBuildings);
        }

        async function loadCurrentUser() {
            const response = await fetch('/api/v1/auth/me', {
                headers: { Authorization: `Bearer ${token}` }
            });
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || 'Phiên đăng nhập không hợp lệ');
            }

            const user = data.result;
            const roles = Array.isArray(user.roles) ? user.roles : [];
            if (!roles.includes('ROLE_ADMIN')) {
                window.location.href = '/home';
                return;
            }

            document.getElementById('adminRoles').textContent = roles.join(', ');
        }

        async function loadDashboardStats() {
            const [buildingResponse, roomResponse] = await Promise.all([
                fetch('/api/v1/buildings?page=0&size=500&sortBy=id&direction=desc', { headers: { Authorization: `Bearer ${token}` } }),
                fetch('/api/v1/rooms?page=0&size=500&sortBy=id&direction=desc', { headers: { Authorization: `Bearer ${token}` } })
            ]);

            const buildingPayload = await buildingResponse.json();
            const roomPayload = await roomResponse.json();

            if (!buildingResponse.ok) {
                throw new Error(buildingPayload.message || 'Không tải được danh sách tòa nhà');
            }
            if (!roomResponse.ok) {
                throw new Error(roomPayload.message || 'Không tải được danh sách phòng');
            }

            buildingItems = Array.isArray(buildingPayload.result?.content) ? buildingPayload.result.content : [];
            const rooms = Array.isArray(roomPayload.result?.content) ? roomPayload.result.content : [];
            const floors = buildingItems.reduce((sum, item) => sum + (Number(item.totalFloors) || 0), 0);
            const roomTotal = typeof roomPayload.result?.totalElements === 'number' ? roomPayload.result.totalElements : rooms.length;

            document.getElementById('buildingCount').textContent = String(buildingItems.length);
            document.getElementById('floorsCount').textContent = String(floors);
            document.getElementById('roomCount').textContent = String(roomTotal);

            renderBuildings(1);
        }

        (async () => {
            try {
                await loadCurrentUser();
                await loadDashboardStats();
            } catch {
                localStorage.removeItem('dormitory_access_token');
                window.location.href = '/login';
            }
        })();
    </script>
</body>

</html>
