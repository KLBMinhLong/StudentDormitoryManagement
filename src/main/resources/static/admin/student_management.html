<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sinh Viên - Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/ui/theme.css">

    <script src="/ui/admin-sidebar.js" defer></script>
    <script src="/ui/admin-export.js" defer></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0EA5A5',
                        'primary-hover': '#0B8F8F',
                        secondary: '#3B82F6',
                        'bg-page': '#F8FAFC',
                        'bg-card': '#FFFFFF',
                        'text-main': '#0F172A',
                        'text-muted': '#475569',
                        border: '#E2E8F0',
                        success: '#16A34A',
                        danger: '#DC2626'
                    },
                    boxShadow: { soft: '0 4px 12px rgba(15, 23, 42, 0.06)' },
                    borderRadius: { base: '12px' },
                    fontFamily: {
                        heading: ['Be Vietnam Pro', 'sans-serif'],
                        body: ['Inter', 'sans-serif']
                    }
                }
            }
        };
    </script>
</head>

<body class="font-body text-text-main bg-bg-page min-h-screen">
<div id="adminLayout" class="w-full max-w-[1440px] mx-auto p-4 md:p-6 min-h-screen">
    <div class="admin-grid grid grid-cols-1 md:grid-cols-[260px_1fr] gap-6 min-h-[calc(100vh-3rem)]">

        <div id="adminSidebarMount"></div>

        <main class="space-y-6">
            <div id="message" class="hidden rounded-base px-4 py-3 text-sm"></div>

            <section class="rounded-base bg-bg-card border border-border shadow-soft p-6">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <h2 class="font-heading text-2xl">Quản lý Sinh Viên</h2>
                        <p class="text-text-muted text-sm mt-1">Danh sách sinh viên và các tác vụ quản trị tài khoản.</p>
                    </div>
                    <button onclick="openModal()" class="rounded-base bg-primary hover:bg-primary-hover text-white px-4 py-2 text-sm font-medium transition-colors">
                        + Thêm sinh viên
                    </button>
                </div>

                <div class="mt-6 flex flex-wrap gap-2">
                    <select id="studentScope" class="border border-border rounded-base px-3 py-2 text-sm w-full md:w-[210px] focus:outline-none focus:border-primary">
                        <option value="ALL">Tất cả sinh viên</option>
                        <option value="RESIDENT">Sinh viên nội trú</option>
                    </select>
                    <input type="text" id="searchInput" placeholder="Tìm theo mã SV, họ tên..." class="border border-border rounded-base px-4 py-2 text-sm w-full md:w-[350px] focus:outline-none focus:border-primary">
                    <button onclick="loadStudents()" class="rounded-base bg-slate-100 hover:bg-slate-200 text-text-main border border-border px-4 py-2 text-sm font-medium">Tìm</button>
                    <button id="btnExportStudents" type="button" class="rounded-base border border-secondary text-secondary hover:bg-blue-50 px-4 py-2 text-sm font-medium inline-flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9m-6-6 6 6m-9 4 2 3 2-3m-4 6h4" />
                        </svg>
                        <span>Xuất Excel</span>
                    </button>
                </div>

                <div class="mt-6 overflow-x-auto border border-border rounded-base">
                    <table class="w-full min-w-[900px]">
                        <thead class="bg-slate-50 border-b border-border">
                        <tr>
                            <th class="text-left text-sm text-text-muted px-4 py-3 font-medium">Avatar</th>
                            <th class="text-left text-sm text-text-muted px-4 py-3 font-medium">Mã SV</th>
                            <th class="text-left text-sm text-text-muted px-4 py-3 font-medium">Họ và tên</th>
                            <th class="text-left text-sm text-text-muted px-4 py-3 font-medium">Giới tính</th>
                            <th class="text-left text-sm text-text-muted px-4 py-3 font-medium">SĐT</th>
                            <th class="text-left text-sm text-text-muted px-4 py-3 font-medium">Email</th>
                            <th class="text-left text-sm text-text-muted px-4 py-3 font-medium">Tài khoản</th>
                            <th class="text-left text-sm text-text-muted px-4 py-3 font-medium text-right">Hành động</th>
                        </tr>
                        </thead>
                        <tbody id="studentBody"></tbody>
                    </table>
                </div>
                <div id="studentPagination" class="mt-4 flex items-center justify-end gap-2"></div>
            </section>
        </main>
    </div>
</div>

<div id="studentModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
    <div class="bg-bg-card rounded-base w-full max-w-lg p-6 shadow-soft mx-4 max-h-[90vh] overflow-y-auto">
        <h3 id="modalTitle" class="font-heading text-xl mb-4">Thêm sinh viên mới</h3>
        <form id="studentForm">
            <input type="hidden" id="studentId">

            <div id="avatarSection" class="hidden mb-6 flex flex-col items-center gap-3">
                <img id="previewAvatar" src="/ui/avatar-default.png" onerror="this.src='/ui/avatar-default.png'" alt="Avatar" class="w-24 h-24 rounded-full border border-border object-cover">
                <div class="flex items-center gap-2">
                    <input type="file" id="avatarInput" accept="image/*" class="text-sm">
                    <button type="button" onclick="uploadAvatar()" class="rounded-base bg-slate-100 hover:bg-slate-200 text-text-main border border-border px-3 py-1 text-xs font-medium">Tải ảnh lên</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="col-span-1 md:col-span-2">
                    <label class="block text-sm font-medium text-text-muted mb-1">Họ và tên *</label>
                    <input type="text" id="fullName" required class="w-full border border-border rounded-base px-3 py-2 text-sm focus:outline-none focus:border-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium text-text-muted mb-1">Mã SV *</label>
                    <input type="text" id="studentCode" required class="w-full border border-border rounded-base px-3 py-2 text-sm focus:outline-none focus:border-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium text-text-muted mb-1">CCCD *</label>
                    <input type="text" id="cccd" required class="w-full border border-border rounded-base px-3 py-2 text-sm focus:outline-none focus:border-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium text-text-muted mb-1">Ngày sinh</label>
                    <input type="date" id="dateOfBirth" class="w-full border border-border rounded-base px-3 py-2 text-sm focus:outline-none focus:border-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium text-text-muted mb-1">Giới tính</label>
                    <select id="gender" class="w-full border border-border rounded-base px-3 py-2 text-sm focus:outline-none focus:border-primary">
                        <option value="Nam">Nam</option>
                        <option value="Nữ">Nữ</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-text-muted mb-1">Số điện thoại</label>
                    <input type="text" id="phone" class="w-full border border-border rounded-base px-3 py-2 text-sm focus:outline-none focus:border-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium text-text-muted mb-1">Email</label>
                    <input type="email" id="email" class="w-full border border-border rounded-base px-3 py-2 text-sm focus:outline-none focus:border-primary">
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-2">
                <button type="button" onclick="closeModal()" class="rounded-base border border-border px-4 py-2 text-sm font-medium hover:bg-slate-50">Hủy</button>
                <button type="submit" class="rounded-base bg-primary hover:bg-primary-hover text-white px-4 py-2 text-sm font-medium">Lưu</button>
            </div>
        </form>
    </div>
</div>

<div id="studentDetailModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
    <div class="bg-bg-card rounded-base w-full max-w-5xl p-6 shadow-soft mx-4 max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between gap-3 mb-4">
            <h3 class="font-heading text-xl">Chi tiết sinh viên</h3>
            <button type="button" onclick="closeDetailModal()" class="rounded-base border border-border px-3 py-1.5 text-sm hover:bg-slate-50">Đóng</button>
        </div>
        <div id="studentDetailContent" class="text-sm"></div>
    </div>
</div>

<script>
    function initSidebar() {
        if (!window.AdminSidebar || typeof window.AdminSidebar.mount !== 'function') {
            setTimeout(initSidebar, 50);
            return;
        }
        window.AdminSidebar.mount({
            mountId: 'adminSidebarMount',
            active: 'students',
            caption: 'Quản trị sinh viên'
        });
    }
    initSidebar();

    const token = localStorage.getItem('dormitory_access_token');
    const studentBody = document.getElementById('studentBody');
    const searchInput = document.getElementById('searchInput');
    const studentScope = document.getElementById('studentScope');
    const message = document.getElementById('message');
    const studentPagination = document.getElementById('studentPagination');
    const studentModal = document.getElementById('studentModal');
    const studentDetailModal = document.getElementById('studentDetailModal');
    const studentDetailContent = document.getElementById('studentDetailContent');
    const studentForm = document.getElementById('studentForm');
    const avatarSection = document.getElementById('avatarSection');

    let debounceTimer;
    let currentPage = 0;
    let currentKeyword = '';
    let deepLinkStudentId = null;
    const pageSize = 10;

    function debounceSearch() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            currentPage = 0;
            currentKeyword = searchInput.value.trim();
            loadStudents();
        }, 300);
    }

    searchInput.addEventListener('input', debounceSearch);

    if (!token) {
        window.location.href = '/login.html';
    }

    async function checkAuthorizationAndLoad() {
        try {
            const response = await fetch('/api/v1/auth/me', {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            });
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || 'Phiên đăng nhập không hợp lệ');
            }

            const user = data.result;
            const roles = Array.isArray(user.roles) ? user.roles : [];
            const isAdmin = roles.includes('ROLE_ADMIN');

            if (!isAdmin) {
                window.location.href = '/home.html';
                return;
            }

            await loadStudents();
            applyStudentDeepLink();
        } catch (error) {
            localStorage.removeItem('dormitory_access_token');
            window.location.href = '/login.html';
        }
    }

    function showMessage(type, text) {
        message.className = 'mb-4 rounded-base px-4 py-3 text-sm block';
        if (type === 'error') {
            message.classList.add('bg-red-50', 'text-danger', 'border', 'border-red-100');
        } else {
            message.classList.add('bg-green-50', 'text-success', 'border', 'border-green-100');
        }
        message.textContent = text;
        setTimeout(() => { message.classList.add('hidden'); }, 3000);
    }

    function escHtml(str) {
        return String(str ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function formatDate(value) {
        if (!value) return '-';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return '-';
        return date.toLocaleDateString('vi-VN');
    }

    function formatDateTime(value) {
        if (!value) return '-';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return '-';
        return date.toLocaleString('vi-VN');
    }

    function contractStatusText(status) {
        const normalized = String(status || '').toUpperCase();
        if (normalized === 'ACTIVE') return 'Đang hiệu lực';
        if (normalized === 'PENDING') return 'Chờ duyệt';
        if (normalized === 'EXPIRED') return 'Hết hạn';
        if (normalized === 'CANCELLED') return 'Đã hủy';
        return normalized || '-';
    }

    function changeRequestStatusText(status) {
        const normalized = String(status || '').toUpperCase();
        if (normalized === 'PENDING') return 'Chờ duyệt';
        if (normalized === 'APPROVED') return 'Đã duyệt';
        if (normalized === 'REJECTED') return 'Từ chối';
        return normalized || '-';
    }

    function issueStatusText(status) {
        const normalized = String(status || '').toUpperCase();
        if (normalized === 'PENDING') return 'Chờ xử lý';
        if (normalized === 'IN_PROGRESS') return 'Đang xử lý';
        if (normalized === 'RESOLVED') return 'Đã xử lý';
        return normalized || '-';
    }

    function buildContractsRows(contracts) {
        if (!contracts.length) {
            return '<tr><td colspan="5" class="px-3 py-4 text-center text-text-muted">Chưa có hợp đồng.</td></tr>';
        }

        return contracts.map((contract) => {
            const roomKeyword = contract.roomNumber ? encodeURIComponent(contract.roomNumber) : '';
            return `
                <tr class="border-t border-border">
                    <td class="px-3 py-2">#${contract.id || '-'}</td>
                    <td class="px-3 py-2">${escHtml(contract.buildingName || '-')} / ${escHtml(contract.roomNumber || '-')} - Giường ${contract.bedNumber || '-'}</td>
                    <td class="px-3 py-2">${formatDate(contract.startDate)} - ${formatDate(contract.endDate)}</td>
                    <td class="px-3 py-2">${contractStatusText(contract.status)}</td>
                    <td class="px-3 py-2 text-right">
                        <a href="/admin/contracts-management.html?contractId=${contract.id}" class="text-secondary hover:underline mr-3">Mở hợp đồng</a>
                        <a href="/admin/rooms.html${roomKeyword ? `?keyword=${roomKeyword}` : ''}" class="text-primary hover:underline">Mở phòng</a>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function buildChangeRequestRows(requests) {
        if (!requests.length) {
            return '<tr><td colspan="5" class="px-3 py-4 text-center text-text-muted">Chưa có yêu cầu thay đổi hợp đồng.</td></tr>';
        }

        return requests.map((request) => `
            <tr class="border-t border-border">
                <td class="px-3 py-2">#${request.id || '-'}</td>
                <td class="px-3 py-2">#${request.contractId || '-'} (${request.changeType === 'EXTEND' ? 'Gia hạn' : 'Hủy'})</td>
                <td class="px-3 py-2">${escHtml(request.reason || '-')}</td>
                <td class="px-3 py-2">${changeRequestStatusText(request.status)}</td>
                <td class="px-3 py-2 text-right">
                    <a href="/admin/contracts-management.html?contractId=${request.contractId}" class="text-secondary hover:underline">Mở hợp đồng</a>
                </td>
            </tr>
        `).join('');
    }

    function buildIssueRows(issues) {
        if (!issues.length) {
            return '<tr><td colspan="5" class="px-3 py-4 text-center text-text-muted">Chưa có yêu cầu sửa chữa.</td></tr>';
        }

        return issues.map((issue) => {
            const roomKeyword = issue.roomNumber ? encodeURIComponent(issue.roomNumber) : '';
            return `
                <tr class="border-t border-border">
                    <td class="px-3 py-2">#${issue.id || '-'}</td>
                    <td class="px-3 py-2">${escHtml(issue.description || '-')}</td>
                    <td class="px-3 py-2">${issue.priority || '-'}</td>
                    <td class="px-3 py-2">${issueStatusText(issue.status)}</td>
                    <td class="px-3 py-2 text-right">
                        <a href="/admin/rooms.html${roomKeyword ? `?keyword=${roomKeyword}` : ''}" class="text-primary hover:underline">Mở phòng</a>
                    </td>
                </tr>
            `;
        }).join('');
    }

    async function fetchAPI(url, options = {}) {
        const headers = {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
        };
        if (options.body instanceof FormData) {
            delete headers['Content-Type'];
        }

        const response = await fetch(url, { ...options, headers });
        const text = await response.text();
        const data = text ? JSON.parse(text) : null;

        if (!response.ok) {
            throw new Error(data?.message || 'Lỗi hệ thống');
        }

        return data?.result ?? null;
    }

    function renderStudentPagination(pageData) {
        if (!pageData || pageData.totalPages <= 1) {
            studentPagination.innerHTML = '';
            return;
        }

        const pageNo = pageData.pageNo;
        const totalPages = pageData.totalPages;
        const totalElements = pageData.totalElements;
        const start = totalElements === 0 ? 0 : pageNo * pageData.pageSize + 1;
        const end = Math.min((pageNo + 1) * pageData.pageSize, totalElements);

        let pageButtons = '';
        const begin = Math.max(0, pageNo - 2);
        const finish = Math.min(totalPages - 1, pageNo + 2);

        for (let i = begin; i <= finish; i++) {
            const activeClass = i === pageNo
                ? 'border-primary bg-primary text-white'
                : 'border-border hover:bg-slate-50';
            pageButtons += `<button class="rounded-base border px-3 py-1.5 text-sm ${activeClass}" data-page="${i}">${i + 1}</button>`;
        }

        studentPagination.innerHTML = `
            <p class="text-sm text-text-muted">Hiển thị ${start}-${end} trên tổng số ${totalElements} kết quả</p>
            <div class="flex flex-wrap items-center gap-2">
                <button class="rounded-base border border-border px-3 py-1.5 text-sm ${pageNo === 0 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-slate-50'}" ${pageNo === 0 ? 'disabled' : ''} data-page="${pageNo - 1}">Trước</button>
                ${pageButtons}
                <button class="rounded-base border border-border px-3 py-1.5 text-sm ${pageNo >= totalPages - 1 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-slate-50'}" ${pageNo >= totalPages - 1 ? 'disabled' : ''} data-page="${pageNo + 1}">Sau</button>
            </div>
        `;

        studentPagination.querySelectorAll('button[data-page]').forEach((btn) => {
            btn.addEventListener('click', () => {
                currentPage = Number(btn.dataset.page);
                loadStudents();
            });
        });
    }

    async function loadStudents() {
        try {
            currentKeyword = searchInput.value.trim();
            const keywordQuery = currentKeyword ? `&keyword=${encodeURIComponent(currentKeyword)}` : '';
            const isResidentScope = studentScope.value === 'RESIDENT';
            const apiPath = isResidentScope ? '/api/v1/students/residents' : '/api/v1/students';
            const url = `${apiPath}?page=${currentPage}&size=${pageSize}&sortBy=id&direction=desc${keywordQuery}`;
            const pageData = await fetchAPI(url);
            const students = Array.isArray(pageData?.content) ? pageData.content : [];

            if (!students.length) {
                studentBody.innerHTML = `<tr><td colspan="8" class="px-4 py-8 text-center text-text-muted">${isResidentScope ? 'Không có dữ liệu sinh viên nội trú.' : 'Không có dữ liệu sinh viên.'}</td></tr>`;
                renderStudentPagination(pageData);
                return;
            }

            studentBody.innerHTML = students.map((st) => {
                const accountText = st.hasAccount ? escHtml(st.username || 'Đã liên kết') : 'Chưa liên kết';
                return `
                <tr class="border-b border-border hover:bg-slate-50">
                    <td class="px-4 py-3">
                        <img src="${st.avatarUrl || '/ui/avatar-default.png'}" onerror="this.src='/ui/avatar-default.png'" class="w-10 h-10 rounded-full object-cover border border-border">
                    </td>
                    <td class="px-4 py-3 text-sm">${escHtml(st.studentCode || '-')}</td>
                    <td class="px-4 py-3 text-sm font-medium">${escHtml(st.fullName || '-')}</td>
                    <td class="px-4 py-3 text-sm">${escHtml(st.gender || '-')}</td>
                    <td class="px-4 py-3 text-sm">${escHtml(st.phone || '-')}</td>
                    <td class="px-4 py-3 text-sm">${escHtml(st.email || '-')}</td>
                    <td class="px-4 py-3 text-sm">${accountText}</td>
                    <td class="px-4 py-3 text-sm text-right">
                        <button onclick="viewStudent(${st.id})" class="text-primary hover:underline mr-2">Xem</button>
                        <button onclick="editStudent(${st.id})" class="text-secondary hover:underline mr-2">Sửa</button>
                        <button onclick="deleteStudent(${st.id})" class="text-danger hover:underline">Xóa</button>
                    </td>
                </tr>
            `;
            }).join('');

            renderStudentPagination(pageData);
        } catch (error) {
            showMessage('error', error.message);
        }
    }

    async function exportStudentsExcel() {
        const params = new URLSearchParams({
            sortBy: 'id',
            direction: 'desc',
            residentOnly: String(studentScope.value === 'RESIDENT')
        });
        const keyword = searchInput.value.trim();
        if (keyword) {
            params.set('keyword', keyword);
        }

        window.AdminExport.downloadExcel({
            url: `/api/v1/reports/admin/students/excel?${params.toString()}`,
            token,
            button: document.getElementById('btnExportStudents'),
            defaultFilename: 'danh-sach-sinh-vien.xlsx',
            loadingText: 'Đang xuất Excel...',
            fallbackError: 'Xuất Excel sinh viên thất bại.',
            onSuccess: () => showMessage('success', 'Đã xuất báo cáo Excel sinh viên.'),
            onError: (error) => showMessage('error', error.message || 'Xuất Excel sinh viên thất bại.')
        });
    }

    async function viewStudent(id) {
        try {
            studentDetailContent.innerHTML = '<div class="py-10 text-center text-text-muted">Đang tải hồ sơ nội trú...</div>';
            studentDetailModal.classList.remove('hidden');

            const st = await fetchAPI(`/api/v1/students/${id}`);
            const [contractsPage, changeRequestPage, issues] = await Promise.all([
                fetchAPI(`/api/v1/contracts/admin/management?page=0&size=6&sortBy=createdAt&direction=desc&keyword=${encodeURIComponent(st.studentCode || '')}`),
                fetchAPI(`/api/v1/contracts/admin/change-requests?page=0&size=6&sortBy=createdAt&direction=desc&keyword=${encodeURIComponent(st.studentCode || '')}`),
                fetchAPI(`/api/v1/issues/student/${id}`)
            ]);

            const contracts = Array.isArray(contractsPage?.content) ? contractsPage.content : [];
            const requests = Array.isArray(changeRequestPage?.content) ? changeRequestPage.content : [];
            const issueRows = Array.isArray(issues) ? issues : [];
            const activeContract = contracts.find((item) => String(item.status || '').toUpperCase() === 'ACTIVE');

            studentDetailContent.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <section class="lg:col-span-1 rounded-base border border-border p-4 bg-slate-50">
                        <h4 class="font-heading text-lg mb-3">Thông tin sinh viên</h4>
                        <div class="space-y-2">
                            <p><span class="text-text-muted">Mã SV:</span> <span class="font-medium">${escHtml(st.studentCode || '-')}</span></p>
                            <p><span class="text-text-muted">Họ tên:</span> <span class="font-medium">${escHtml(st.fullName || '-')}</span></p>
                            <p><span class="text-text-muted">Ngày sinh:</span> <span class="font-medium">${formatDate(st.dateOfBirth)}</span></p>
                            <p><span class="text-text-muted">Giới tính:</span> <span class="font-medium">${escHtml(st.gender || '-')}</span></p>
                            <p><span class="text-text-muted">SĐT:</span> <span class="font-medium">${escHtml(st.phone || '-')}</span></p>
                            <p><span class="text-text-muted">Email:</span> <span class="font-medium">${escHtml(st.email || '-')}</span></p>
                            <p><span class="text-text-muted">CCCD:</span> <span class="font-medium">${escHtml(st.cccd || '-')}</span></p>
                        </div>
                    </section>
                    <section class="lg:col-span-2 rounded-base border border-border p-4">
                        <h4 class="font-heading text-lg mb-3">Nơi ở hiện tại</h4>
                        ${activeContract ? `
                            <div class="space-y-2">
                                <p><span class="text-text-muted">Tòa / Phòng / Giường:</span> <span class="font-medium">${escHtml(activeContract.buildingName || '-')} / ${escHtml(activeContract.roomNumber || '-')} / ${activeContract.bedNumber || '-'}</span></p>
                                <p><span class="text-text-muted">Hợp đồng:</span> <span class="font-medium">#${activeContract.id} (${contractStatusText(activeContract.status)})</span></p>
                                <p><span class="text-text-muted">Thời hạn:</span> <span class="font-medium">${formatDate(activeContract.startDate)} - ${formatDate(activeContract.endDate)}</span></p>
                                <div class="pt-2">
                                    <a href="/admin/contracts-management.html?contractId=${activeContract.id}" class="text-secondary hover:underline mr-4">Mở hợp đồng hiện tại</a>
                                    <a href="/admin/rooms.html?keyword=${encodeURIComponent(activeContract.roomNumber || '')}" class="text-primary hover:underline">Mở trang phòng</a>
                                </div>
                            </div>
                        ` : '<p class="text-text-muted">Sinh viên hiện chưa có hợp đồng đang hiệu lực.</p>'}
                    </section>
                </div>

                <section class="mt-6">
                    <h4 class="font-heading text-lg mb-3">Hợp đồng gần đây</h4>
                    <div class="overflow-x-auto rounded-base border border-border">
                        <table class="w-full min-w-[760px] text-sm">
                            <thead class="bg-slate-50">
                                <tr>
                                    <th class="px-3 py-2 text-left text-text-muted">Mã HĐ</th>
                                    <th class="px-3 py-2 text-left text-text-muted">Phòng/Giường</th>
                                    <th class="px-3 py-2 text-left text-text-muted">Thời hạn</th>
                                    <th class="px-3 py-2 text-left text-text-muted">Trạng thái</th>
                                    <th class="px-3 py-2 text-right text-text-muted">Điều hướng</th>
                                </tr>
                            </thead>
                            <tbody>${buildContractsRows(contracts)}</tbody>
                        </table>
                    </div>
                </section>

                <section class="mt-6">
                    <h4 class="font-heading text-lg mb-3">Yêu cầu thay đổi hợp đồng</h4>
                    <div class="overflow-x-auto rounded-base border border-border">
                        <table class="w-full min-w-[760px] text-sm">
                            <thead class="bg-slate-50">
                                <tr>
                                    <th class="px-3 py-2 text-left text-text-muted">Mã YC</th>
                                    <th class="px-3 py-2 text-left text-text-muted">Loại</th>
                                    <th class="px-3 py-2 text-left text-text-muted">Lý do</th>
                                    <th class="px-3 py-2 text-left text-text-muted">Trạng thái</th>
                                    <th class="px-3 py-2 text-right text-text-muted">Điều hướng</th>
                                </tr>
                            </thead>
                            <tbody>${buildChangeRequestRows(requests)}</tbody>
                        </table>
                    </div>
                </section>

                <section class="mt-6">
                    <h4 class="font-heading text-lg mb-3">Yêu cầu sửa chữa</h4>
                    <div class="overflow-x-auto rounded-base border border-border">
                        <table class="w-full min-w-[760px] text-sm">
                            <thead class="bg-slate-50">
                                <tr>
                                    <th class="px-3 py-2 text-left text-text-muted">Mã YC</th>
                                    <th class="px-3 py-2 text-left text-text-muted">Mô tả</th>
                                    <th class="px-3 py-2 text-left text-text-muted">Ưu tiên</th>
                                    <th class="px-3 py-2 text-left text-text-muted">Trạng thái</th>
                                    <th class="px-3 py-2 text-right text-text-muted">Điều hướng</th>
                                </tr>
                            </thead>
                            <tbody>${buildIssueRows(issueRows)}</tbody>
                        </table>
                    </div>
                </section>
            `;
        } catch (error) {
            showMessage('error', error.message);
            closeDetailModal();
        }
    }

    function applyStudentDeepLink() {
        if (!deepLinkStudentId) return;
        const targetId = deepLinkStudentId;
        deepLinkStudentId = null;
        viewStudent(targetId);
        const url = new URL(window.location.href);
        url.searchParams.delete('studentId');
        window.history.replaceState({}, '', url.pathname + (url.searchParams.toString() ? `?${url.searchParams.toString()}` : ''));
    }

    function closeDetailModal() {
        studentDetailModal.classList.add('hidden');
    }

    function openModal() {
        studentForm.reset();
        document.getElementById('studentId').value = '';
        document.getElementById('modalTitle').textContent = 'Thêm sinh viên mới';
        avatarSection.classList.add('hidden');
        document.getElementById('studentCode').disabled = false;
        studentModal.classList.remove('hidden');
    }

    function closeModal() {
        studentModal.classList.add('hidden');
    }

    async function editStudent(studentId) {
        let student;
        try {
            student = await fetchAPI(`/api/v1/students/${studentId}`);
        } catch (error) {
            showMessage('error', error.message);
            return;
        }

        document.getElementById('studentId').value = student.id;
        document.getElementById('studentCode').value = student.studentCode;
        document.getElementById('studentCode').disabled = true;
        document.getElementById('fullName').value = student.fullName;
        document.getElementById('dateOfBirth').value = student.dateOfBirth || '';
        document.getElementById('gender').value = student.gender || 'Nam';
        document.getElementById('phone').value = student.phone || '';
        document.getElementById('cccd').value = student.cccd;
        document.getElementById('email').value = student.email || '';

        document.getElementById('previewAvatar').src = student.avatarUrl || '/ui/avatar-default.png';
        avatarSection.classList.remove('hidden');
        document.getElementById('modalTitle').textContent = 'Cập nhật sinh viên';
        studentModal.classList.remove('hidden');
    }

    studentForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('studentId').value;
        const payload = {
            studentCode: document.getElementById('studentCode').value,
            fullName: document.getElementById('fullName').value,
            dateOfBirth: document.getElementById('dateOfBirth').value || null,
            gender: document.getElementById('gender').value,
            phone: document.getElementById('phone').value,
            cccd: document.getElementById('cccd').value,
            email: document.getElementById('email').value
        };

        try {
            if (id) {
                await fetchAPI(`/api/v1/students/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
                showMessage('success', 'Cập nhật thành công');
            } else {
                await fetchAPI(`/api/v1/students`, { method: 'POST', body: JSON.stringify(payload) });
                showMessage('success', 'Thêm mới thành công');
            }
            closeModal();
            loadStudents();
        } catch (error) {
            showMessage('error', error.message);
        }
    });

    async function deleteStudent(id) {
        if (!confirm('Bạn có chắc chắn muốn xóa sinh viên này? Tài khoản đăng nhập của sinh viên cũng sẽ bị xóa.')) return;
        try {
            await fetchAPI(`/api/v1/students/${id}`, { method: 'DELETE' });
            showMessage('success', 'Xóa thành công');
            if (currentPage > 0) {
                currentPage = 0;
            }
            loadStudents();
        } catch (error) {
            showMessage('error', error.message);
        }
    }

    async function uploadAvatar() {
        const id = document.getElementById('studentId').value;
        const fileInput = document.getElementById('avatarInput');

        if (!id) {
            showMessage('error', 'Vui lòng lưu thông tin sinh viên trước khi tải ảnh lên.');
            return;
        }

        if (fileInput.files.length === 0) {
            showMessage('error', 'Vui lòng chọn một file ảnh.');
            return;
        }

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        try {
            const response = await fetch(`/api/v1/students/${id}/avatar`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`
                },
                body: formData
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.message || 'Lỗi tải ảnh');

            document.getElementById('previewAvatar').src = data.result;
            showMessage('success', 'Tải ảnh lên thành công');
            loadStudents();
            fileInput.value = '';
        } catch (error) {
            showMessage('error', error.message);
        }
    }

    studentDetailModal.addEventListener('click', (event) => {
        if (event.target === studentDetailModal) {
            closeDetailModal();
        }
    });

    studentScope.addEventListener('change', () => {
        currentPage = 0;
        loadStudents();
    });

    document.getElementById('btnExportStudents').addEventListener('click', exportStudentsExcel);

    (() => {
        const params = new URLSearchParams(window.location.search);
        const scope = params.get('scope');
        if (scope === 'RESIDENT') {
            studentScope.value = 'RESIDENT';
        }
        const keywordParam = params.get('keyword');
        if (keywordParam) {
            searchInput.value = keywordParam;
        }
        const studentIdParam = Number(params.get('studentId') || 0);
        if (studentIdParam > 0) {
            deepLinkStudentId = studentIdParam;
        }
    })();

    if (token) {
        checkAuthorizationAndLoad();
    }
</script>
</body>

</html>
