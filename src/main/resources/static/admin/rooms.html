<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTX - Quản lý phòng</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/ui/theme.css">
    <script src="/ui/admin-sidebar.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0EA5A5',
                        'primary-hover': '#0B8F8F',
                        secondary: '#3B82F6',
                        'bg-page': '#F8FAFC',
                        'bg-card': '#FFFFFF',
                        'text-main': '#0F172A',
                        'text-muted': '#475569',
                        border: '#E2E8F0',
                        success: '#16A34A',
                        warning: '#D97706',
                        danger: '#DC2626'
                    },
                    boxShadow: { soft: '0 4px 12px rgba(15, 23, 42, 0.06)' },
                    borderRadius: { base: '12px' },
                    fontFamily: {
                        heading: ['Be Vietnam Pro', 'sans-serif'],
                        body: ['Inter', 'sans-serif']
                    }
                }
            }
        };
    </script>
</head>
<body class="font-body text-text-main bg-bg-page min-h-screen">
    <div id="adminLayout" class="max-w-[1200px] mx-auto p-4 md:p-6 min-h-screen">
        <div class="admin-grid grid grid-cols-1 md:grid-cols-[260px_1fr] gap-6 min-h-[calc(100vh-3rem)]">
            <div id="adminSidebarMount"></div>

            <main class="space-y-6">

                <section class="rounded-base bg-bg-card border border-border shadow-soft p-6">
                    <div class="flex items-center justify-between gap-3">
                        <div>
                            <h2 class="font-heading text-2xl">Danh sách phòng</h2>
                            <p class="text-sm text-text-muted mt-1">Hiển thị dữ liệu phòng theo chuẩn tiếng Việt có dấu.</p>
                        </div>
                        <a href="/admin/beds" class="rounded-base border border-border px-3 py-2 text-sm font-medium hover:bg-slate-50">Xem quản lý giường</a>
                    </div>

                    <div class="mt-4 overflow-x-auto rounded-base border border-border">
                        <table class="w-full min-w-[760px] text-sm">
                            <thead>
                                <tr class="bg-slate-50 border-b border-border text-text-muted text-left text-xs uppercase tracking-wide font-medium">
                                    <th class="px-4 py-3 w-16">ID</th>
                                    <th class="px-4 py-3">Số phòng</th>
                                    <th class="px-4 py-3">Tòa nhà</th>
                                    <th class="px-4 py-3">Loại phòng</th>
                                    <th class="px-4 py-3 w-28">Trạng thái</th>
                                    <th class="px-4 py-3 w-32 text-right">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="roomBody" class="divide-y divide-border">
                                <tr>
                                    <td colspan="6" class="px-4 py-8 text-center text-text-muted">Đang tải dữ liệu...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div id="roomPagination" class="mt-4 flex items-center justify-end gap-2"></div>
                </section>
            </main>
        </div>
    </div>

    <script>
        const ITEMS_PER_PAGE = 10;
        const token = localStorage.getItem('dormitory_access_token');
        let rooms = [];
        let currentPage = 1;

        if (!token) {
            window.location.href = '/login';
        }

        function initAdminSidebar() {
            if (!window.AdminSidebar || typeof window.AdminSidebar.mount !== 'function') {
                window.setTimeout(initAdminSidebar, 50);
                return;
            }

            window.AdminSidebar.mount({
                mountId: 'adminSidebarMount',
                active: 'rooms',
                caption: 'Tác vụ quản trị'
            });
        }

        initAdminSidebar();

        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function paginate(items, page) {
            const totalPages = Math.max(1, Math.ceil(items.length / ITEMS_PER_PAGE));
            const safePage = Math.min(Math.max(page, 1), totalPages);
            const start = (safePage - 1) * ITEMS_PER_PAGE;
            return {
                safePage,
                totalPages,
                data: items.slice(start, start + ITEMS_PER_PAGE)
            };
        }

        function renderPagination(page, totalPages) {
            const container = document.getElementById('roomPagination');
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = `
                <button class="rounded-base border border-border px-3 py-1.5 text-sm ${page === 1 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-slate-50'}" ${page === 1 ? 'disabled' : ''} data-page="${page - 1}">Trước</button>
                <span class="text-sm text-text-muted">Trang ${page}/${totalPages}</span>
                <button class="rounded-base border border-border px-3 py-1.5 text-sm ${page === totalPages ? 'opacity-50 cursor-not-allowed' : 'hover:bg-slate-50'}" ${page === totalPages ? 'disabled' : ''} data-page="${page + 1}">Sau</button>
            `;

            container.querySelectorAll('button[data-page]').forEach((btn) => {
                btn.addEventListener('click', () => renderRows(Number(btn.dataset.page)));
            });
        }

        function renderRows(page) {
            const body = document.getElementById('roomBody');
            const paged = paginate(rooms, page);
            currentPage = paged.safePage;

            if (!paged.data.length) {
                body.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-text-muted">Chưa có dữ liệu phòng.</td></tr>';
                document.getElementById('roomPagination').innerHTML = '';
                return;
            }

            body.innerHTML = paged.data.map((room) => {
                const status = room.status || 'TRỐNG';
                const statusClass = status === 'FULL'
                    ? 'bg-red-100 text-danger'
                    : status === 'MAINTENANCE'
                        ? 'bg-amber-100 text-warning'
                        : 'bg-green-100 text-success';

                return `
                    <tr>
                        <td class="px-4 py-3 text-xs font-mono text-text-muted">${room.id ?? '-'}</td>
                        <td class="px-4 py-3 font-medium">${escHtml(room.roomNumber || '-')}</td>
                        <td class="px-4 py-3">${escHtml(room.buildingName || 'Chưa gán')}</td>
                        <td class="px-4 py-3">${escHtml(room.roomTypeName || 'Chưa gán')}</td>
                        <td class="px-4 py-3">
                            <span class="px-2 py-1 rounded-full text-xs font-medium ${statusClass}">${escHtml(status)}</span>
                        </td>
                        <td class="px-4 py-3 text-right">
                            <a href="/room-detail.html?id=${room.id}" class="text-secondary hover:underline text-sm font-medium">Xem giường</a>
                        </td>
                    </tr>
                `;
            }).join('');

            renderPagination(currentPage, paged.totalPages);
        }

        async function ensureAdmin() {
            const response = await fetch('/api/v1/auth/me', {
                headers: { Authorization: `Bearer ${token}` }
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(payload.message || 'Phiên đăng nhập không hợp lệ');

            const roles = Array.isArray(payload.result?.roles) ? payload.result.roles : [];
            if (!roles.includes('ROLE_ADMIN')) {
                window.location.href = '/home';
            }
        }

        async function loadRooms() {
            const response = await fetch('/api/v1/rooms', {
                headers: { Authorization: `Bearer ${token}` }
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(payload.message || 'Không tải được danh sách phòng');
            rooms = Array.isArray(payload.result) ? payload.result : [];
            renderRows(1);
        }

        (async () => {
            try {
                await ensureAdmin();
                await loadRooms();
            } catch {
                localStorage.removeItem('dormitory_access_token');
                window.location.href = '/login';
            }
        })();
    </script>
</body>
</html>
