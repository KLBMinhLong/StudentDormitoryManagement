<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTX - Quản lý giường</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/ui/theme.css">
    <script src="/ui/admin-sidebar.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0EA5A5',
                        'primary-hover': '#0B8F8F',
                        secondary: '#3B82F6',
                        'bg-page': '#F8FAFC',
                        'bg-card': '#FFFFFF',
                        'text-main': '#0F172A',
                        'text-muted': '#475569',
                        border: '#E2E8F0',
                        success: '#16A34A',
                        warning: '#D97706',
                        danger: '#DC2626'
                    },
                    boxShadow: { soft: '0 4px 12px rgba(15, 23, 42, 0.06)' },
                    borderRadius: { base: '12px' },
                    fontFamily: {
                        heading: ['Be Vietnam Pro', 'sans-serif'],
                        body: ['Inter', 'sans-serif']
                    }
                }
            }
        };
    </script>
</head>
<body class="font-body text-text-main bg-bg-page min-h-screen">
    <div id="adminLayout" class="max-w-[1200px] mx-auto p-4 md:p-6 min-h-screen">
        <div class="admin-grid grid grid-cols-1 md:grid-cols-[260px_1fr] gap-6 min-h-[calc(100vh-3rem)]">
            <div id="adminSidebarMount"></div>

            <main class="space-y-6">

                <section class="rounded-base bg-bg-card border border-border shadow-soft p-6">
                    <h2 class="font-heading text-2xl">Danh sách giường theo phòng</h2>
                    <p class="text-sm text-text-muted mt-1">Chọn phòng để xem sơ đồ giường trực quan và cập nhật trạng thái vào/ra.</p>

                    <div class="mt-4">
                        <label for="roomSelect" class="block text-sm font-medium mb-1.5">Chọn phòng</label>
                        <select id="roomSelect" class="w-full md:w-[320px] rounded-base border border-border px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                            <option value="">Đang tải danh sách phòng...</option>
                        </select>
                    </div>

                    <div class="mt-4 overflow-x-auto rounded-base border border-border">
                        <table class="w-full min-w-[720px] text-sm">
                            <thead>
                                <tr class="bg-slate-50 border-b border-border text-text-muted text-left text-xs uppercase tracking-wide font-medium">
                                    <th class="px-4 py-3 w-16">ID</th>
                                    <th class="px-4 py-3">Giường số</th>
                                    <th class="px-4 py-3">Phòng</th>
                                    <th class="px-4 py-3">Sinh viên</th>
                                    <th class="px-4 py-3 w-32">Trạng thái</th>
                                    <th class="px-4 py-3 w-36 text-right">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="bedBody" class="divide-y divide-border">
                                <tr>
                                    <td colspan="6" class="px-4 py-8 text-center text-text-muted">Vui lòng chọn phòng để xem danh sách giường.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div id="bedSummary" class="mt-4 text-sm text-text-muted hidden"></div>

                    <div id="bedMap" class="mt-4 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-3"></div>
                </section>
            </main>
        </div>
    </div>

    <script>
        const ITEMS_PER_PAGE = 10;
        const token = localStorage.getItem('dormitory_access_token');

        let rooms = [];
        let bedItems = [];
        let selectedRoomName = '';
        let selectedRoomId = null;

        if (!token) {
            window.location.href = '/login';
        }

        function initAdminSidebar() {
            if (!window.AdminSidebar || typeof window.AdminSidebar.mount !== 'function') {
                window.setTimeout(initAdminSidebar, 50);
                return;
            }

            window.AdminSidebar.mount({
                mountId: 'adminSidebarMount',
                active: 'beds',
                caption: 'Tác vụ quản trị'
            });
        }

        initAdminSidebar();

        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderBedMap() {
            const map = document.getElementById('bedMap');
            if (!bedItems.length) {
                map.innerHTML = '';
                return;
            }

            map.innerHTML = bedItems.map((bed) => {
                const occupied = !!bed.isOccupied;
                const cardClass = occupied ? 'border-danger bg-red-50' : 'border-success bg-green-50';
                const badgeClass = occupied ? 'bg-red-100 text-danger' : 'bg-green-100 text-success';
                const badgeText = occupied ? 'Đang sử dụng' : 'Còn trống';

                return `
                    <article class="rounded-base border ${cardClass} p-3 shadow-soft">
                        <div class="flex items-start justify-between gap-2">
                            <p class="font-medium">Giường ${bed.bedNumber}</p>
                            <span class="px-2 py-0.5 rounded-full text-xs font-medium ${badgeClass}">${badgeText}</span>
                        </div>
                        <p class="text-xs text-text-muted mt-2 truncate" title="${escHtml(bed.studentName || 'Chưa có sinh viên')}">${escHtml(bed.studentName || 'Chưa có sinh viên')}</p>
                        <button class="mt-3 w-full rounded-base border border-border px-3 py-1.5 text-xs font-medium hover:bg-white" data-action="toggle-map" data-id="${bed.id}" data-occupied="${occupied}">
                            ${occupied ? 'Check-out' : 'Check-in'}
                        </button>
                    </article>
                `;
            }).join('');
        }

        function renderBeds() {
            const body = document.getElementById('bedBody');

            if (!bedItems.length) {
                body.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-text-muted">Phòng này chưa có giường.</td></tr>';
                document.getElementById('bedSummary').classList.add('hidden');
                renderBedMap();
                return;
            }

            const occupiedCount = bedItems.filter((bed) => !!bed.isOccupied).length;
            document.getElementById('bedSummary').classList.remove('hidden');
            document.getElementById('bedSummary').textContent = `Phòng ${selectedRoomName}: ${occupiedCount}/${bedItems.length} giường đang sử dụng.`;

            body.innerHTML = bedItems.map((bed) => {
                const occupied = !!bed.isOccupied;
                const statusText = occupied ? 'Đã sử dụng' : 'Còn trống';
                const statusClass = occupied ? 'bg-red-100 text-danger' : 'bg-green-100 text-success';
                return `
                    <tr>
                        <td class="px-4 py-3 text-xs font-mono text-text-muted">${bed.id ?? '-'}</td>
                        <td class="px-4 py-3 font-medium">Giường ${bed.bedNumber ?? '-'}</td>
                        <td class="px-4 py-3">${escHtml(selectedRoomName || '-')}</td>
                        <td class="px-4 py-3">${escHtml(bed.studentName || 'Chưa có')}</td>
                        <td class="px-4 py-3"><span class="px-2 py-1 rounded-full text-xs font-medium ${statusClass}">${statusText}</span></td>
                        <td class="px-4 py-3 text-right">
                            <button class="rounded-base border border-border px-3 py-1.5 text-xs font-medium hover:bg-slate-50" data-action="toggle-row" data-id="${bed.id}" data-occupied="${occupied}">
                                ${occupied ? 'Check-out' : 'Check-in'}
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');

            renderBedMap();
        }

        async function ensureAdmin() {
            const response = await fetch('/api/v1/auth/me', {
                headers: { Authorization: `Bearer ${token}` }
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(payload.message || 'Phiên đăng nhập không hợp lệ');

            const roles = Array.isArray(payload.result?.roles) ? payload.result.roles : [];
            if (!roles.includes('ROLE_ADMIN')) {
                window.location.href = '/home';
            }
        }

        async function loadRooms() {
            const response = await fetch('/api/v1/rooms?page=0&size=500&sortBy=id&direction=desc', {
                headers: { Authorization: `Bearer ${token}` }
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(payload.message || 'Không tải được danh sách phòng');
            rooms = Array.isArray(payload.result?.content) ? payload.result.content : [];

            const select = document.getElementById('roomSelect');
            if (!rooms.length) {
                select.innerHTML = '<option value="">Chưa có phòng</option>';
                return;
            }

            select.innerHTML = '<option value="">Chọn phòng...</option>' + rooms
                .map((room) => `<option value="${room.id}">${escHtml(room.roomNumber)} - ${escHtml(room.buildingName || 'Chưa gán')}</option>`)
                .join('');
        }

        async function loadBedsByRoom(roomId) {
            selectedRoomId = Number(roomId);
            const room = rooms.find((item) => Number(item.id) === Number(roomId));
            selectedRoomName = room ? room.roomNumber : '';

            const response = await fetch(`/api/v1/rooms/${roomId}/beds?page=0&size=200&sortBy=bedNumber&direction=asc`, {
                headers: { Authorization: `Bearer ${token}` }
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(payload.message || 'Không tải được danh sách giường');
            bedItems = Array.isArray(payload.result?.content) ? payload.result.content : [];
            renderBeds();
        }

        async function toggleBedOccupancy(bedId, currentOccupied) {
            if (!selectedRoomId) {
                throw new Error('Vui lòng chọn phòng trước khi cập nhật trạng thái giường.');
            }

            const response = await fetch(`/api/v1/rooms/${selectedRoomId}/beds/${bedId}/occupancy`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${token}`
                },
                body: JSON.stringify({ occupied: !currentOccupied })
            });
            const payload = await response.json();
            if (!response.ok) {
                throw new Error(payload.message || 'Không thể cập nhật trạng thái giường');
            }

            await loadBedsByRoom(selectedRoomId);
        }

        document.getElementById('roomSelect').addEventListener('change', async (event) => {
            const roomId = event.target.value;
            if (!roomId) {
                bedItems = [];
                selectedRoomId = null;
                selectedRoomName = '';
                document.getElementById('bedBody').innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-text-muted">Vui lòng chọn phòng để xem danh sách giường.</td></tr>';
                document.getElementById('bedSummary').classList.add('hidden');
                document.getElementById('bedMap').innerHTML = '';
                return;
            }

            try {
                await loadBedsByRoom(roomId);
            } catch {
                bedItems = [];
                document.getElementById('bedBody').innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-danger">Không tải được danh sách giường.</td></tr>';
                document.getElementById('bedSummary').classList.add('hidden');
                document.getElementById('bedMap').innerHTML = '';
            }
        });

        document.getElementById('bedBody').addEventListener('click', async (event) => {
            const button = event.target.closest('button[data-action="toggle-row"]');
            if (!button) return;

            try {
                await toggleBedOccupancy(Number(button.dataset.id), button.dataset.occupied === 'true');
            } catch (error) {
                alert(error.message || 'Không thể cập nhật trạng thái giường.');
            }
        });

        document.getElementById('bedMap').addEventListener('click', async (event) => {
            const button = event.target.closest('button[data-action="toggle-map"]');
            if (!button) return;

            try {
                await toggleBedOccupancy(Number(button.dataset.id), button.dataset.occupied === 'true');
            } catch (error) {
                alert(error.message || 'Không thể cập nhật trạng thái giường.');
            }
        });

        (async () => {
            try {
                await ensureAdmin();
                await loadRooms();
            } catch {
                localStorage.removeItem('dormitory_access_token');
                window.location.href = '/login';
            }
        })();
    </script>
</body>
</html>
