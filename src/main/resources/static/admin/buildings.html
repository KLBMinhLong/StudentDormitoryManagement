<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTX - Quản lý tòa nhà</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/ui/theme.css">
    <script src="/ui/admin-sidebar.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0EA5A5',
                        'primary-hover': '#0B8F8F',
                        secondary: '#3B82F6',
                        danger: '#DC2626',
                        'danger-hover': '#B91C1C',
                        'bg-page': '#F8FAFC',
                        'bg-card': '#FFFFFF',
                        'text-main': '#0F172A',
                        'text-muted': '#475569',
                        border: '#E2E8F0',
                        success: '#16A34A',
                        warning: '#D97706'
                    },
                    boxShadow: { soft: '0 4px 12px rgba(15, 23, 42, 0.06)' },
                    borderRadius: { base: '12px' },
                    fontFamily: {
                        heading: ['Be Vietnam Pro', 'sans-serif'],
                        body: ['Inter', 'sans-serif']
                    }
                }
            }
        };
    </script>
</head>

<body class="font-body text-text-main bg-bg-page min-h-screen">
    <div id="toast" class="fixed top-5 right-5 z-50 hidden">
        <div id="toastBox" class="flex items-center gap-3 rounded-base px-4 py-3 shadow-soft text-sm font-medium">
            <span id="toastMsg"></span>
        </div>
    </div>

    <div id="adminLayout" class="max-w-[1200px] mx-auto p-4 md:p-6 min-h-screen">
        <div class="admin-grid grid grid-cols-1 md:grid-cols-[260px_1fr] gap-6 min-h-[calc(100vh-3rem)]">
            <div id="adminSidebarMount"></div>

            <main class="space-y-6">

                <section class="rounded-base bg-bg-card border border-border shadow-soft p-6">
                    <div class="flex items-center justify-between mb-6 gap-3">
                        <div>
                            <h2 class="font-heading text-2xl">Danh sách tòa nhà</h2>
                            <p class="text-sm text-text-muted mt-1">Quản lý thông tin tòa nhà với dữ liệu tiếng Việt có dấu.</p>
                        </div>
                        <button type="button" id="btnAdd" class="rounded-base bg-primary hover:bg-primary-hover text-white px-4 py-2 text-sm font-medium transition-colors flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                            </svg>
                            Thêm tòa nhà
                        </button>
                    </div>

                    <div class="overflow-x-auto rounded-base border border-border">
                        <table class="w-full text-sm min-w-[760px]">
                            <thead>
                                <tr class="bg-slate-50 border-b border-border text-text-muted text-left text-xs uppercase tracking-wide font-medium">
                                    <th class="px-4 py-3 w-16">ID</th>
                                    <th class="px-4 py-3">Tên tòa</th>
                                    <th class="px-4 py-3 w-28">Số tầng</th>
                                    <th class="px-4 py-3">Mô tả</th>
                                    <th class="px-4 py-3 w-40">Ngày tạo</th>
                                    <th class="px-4 py-3 w-40">Cập nhật</th>
                                    <th class="px-4 py-3 w-28 text-right">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="buildingTableBody" class="divide-y divide-border">
                                <tr id="rowLoading">
                                    <td colspan="7" class="px-4 py-8 text-center text-text-muted">Đang tải dữ liệu...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div id="tablePagination" class="mt-4 flex items-center justify-end gap-2"></div>

                    <div id="emptyState" class="hidden text-center py-12">
                        <p class="text-text-muted text-sm">Chưa có tòa nhà nào. Nhấn <strong>Thêm tòa nhà</strong> để bắt đầu.</p>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 z-40 hidden">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" id="modalBackdrop"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4">
            <div class="relative bg-bg-card rounded-base shadow-soft w-full max-w-lg p-6">
                <div class="flex items-center justify-between mb-5">
                    <h3 id="modalTitle" class="font-heading text-xl">Thêm tòa nhà</h3>
                    <button type="button" id="modalClose" class="text-text-muted hover:text-text-main transition-colors p-1 rounded-base focus:outline-none focus-visible:ring-2 focus-visible:ring-secondary" aria-label="Đóng">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
                <form id="buildingForm" novalidate>
                    <input type="hidden" id="editId">
                    <div class="mb-4">
                        <label for="fieldName" class="block text-sm font-medium mb-1.5">Tên tòa nhà <span class="text-danger">*</span></label>
                        <input id="fieldName" type="text" maxlength="150" placeholder="Nhập tên tòa nhà (có thể dùng tiếng Việt có dấu)..."
                            class="w-full rounded-base border border-border px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary transition">
                        <p id="nameError" class="text-danger text-xs mt-1 hidden"></p>
                    </div>
                    <div class="mb-4">
                        <label for="fieldFloors" class="block text-sm font-medium mb-1.5">Số tầng <span class="text-danger">*</span></label>
                        <input id="fieldFloors" type="number" min="1" max="99" placeholder="Nhập số tầng..."
                            class="w-full rounded-base border border-border px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary transition">
                        <p id="floorsError" class="text-danger text-xs mt-1 hidden"></p>
                    </div>
                    <div class="mb-6">
                        <label for="fieldDesc" class="block text-sm font-medium mb-1.5">Mô tả</label>
                        <textarea id="fieldDesc" rows="4" maxlength="1000" placeholder="Nhập mô tả (tùy chọn, hỗ trợ tiếng Việt có dấu)..."
                            class="w-full rounded-base border border-border px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary transition resize-none"></textarea>
                        <p id="descError" class="text-danger text-xs mt-1 hidden"></p>
                    </div>
                    <div class="flex justify-end gap-2">
                        <button type="button" id="btnCancel"
                            class="rounded-base border border-border px-4 py-2.5 text-sm font-medium text-text-main hover:bg-slate-50 transition-colors">Hủy</button>
                        <button type="submit" id="btnSubmit"
                            class="rounded-base bg-primary hover:bg-primary-hover text-white px-4 py-2.5 text-sm font-medium transition-colors">Lưu</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="deleteModal" class="fixed inset-0 z-40 hidden">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4">
            <div class="relative bg-bg-card rounded-base shadow-soft w-full max-w-sm p-6 text-center">
                <h3 class="font-heading text-lg mb-2">Xác nhận xóa</h3>
                <p class="text-text-muted text-sm mb-6">Bạn có chắc chắn muốn xóa tòa nhà <strong id="deleteName"></strong> không?</p>
                <div class="flex justify-center gap-3">
                    <button type="button" id="deleteCancel" class="rounded-base border border-border px-4 py-2 text-sm font-medium hover:bg-slate-50 transition-colors">Hủy</button>
                    <button type="button" id="deleteConfirm" class="rounded-base bg-danger hover:bg-danger-hover text-white px-4 py-2 text-sm font-medium transition-colors">Xóa</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ITEMS_PER_PAGE = 10;
        const API_BASE = '/api/v1/buildings';
        const token = localStorage.getItem('dormitory_access_token');
        let deleteTargetId = null;
        let buildingsCache = [];
        let currentPage = 1;

        if (!token) {
            window.location.href = '/login';
        }

        function initAdminSidebar() {
            if (!window.AdminSidebar || typeof window.AdminSidebar.mount !== 'function') {
                window.setTimeout(initAdminSidebar, 50);
                return;
            }

            window.AdminSidebar.mount({
                mountId: 'adminSidebarMount',
                active: 'buildings',
                caption: 'Tác vụ quản trị'
            });
        }

        initAdminSidebar();

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const box = document.getElementById('toastBox');
            const msg = document.getElementById('toastMsg');
            const colors = {
                success: 'bg-green-50 text-success border border-green-200',
                error: 'bg-red-50 text-danger border border-red-200',
                info: 'bg-blue-50 text-secondary border border-blue-200'
            };
            box.className = `flex items-center gap-3 rounded-base px-4 py-3 shadow-soft text-sm font-medium ${colors[type] || colors.info}`;
            msg.textContent = message;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function authHeaders() {
            return {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`
            };
        }

        async function ensureAdmin() {
            const res = await fetch('/api/v1/auth/me', {
                headers: { Authorization: `Bearer ${token}` }
            });
            const payload = await res.json();
            if (!res.ok) {
                throw new Error(payload.message || 'Phiên đăng nhập không hợp lệ');
            }

            const roles = Array.isArray(payload.result?.roles) ? payload.result.roles : [];
            if (!roles.includes('ROLE_ADMIN')) {
                window.location.href = '/home';
                return;
            }
        }

        function fmtDate(str) {
            if (!str) return '-';
            return str.replace('T', ' ').substring(0, 16);
        }

        function paginate(items, page) {
            const totalPages = Math.max(1, Math.ceil(items.length / ITEMS_PER_PAGE));
            const safePage = Math.min(Math.max(page, 1), totalPages);
            const start = (safePage - 1) * ITEMS_PER_PAGE;
            return {
                safePage,
                totalPages,
                data: items.slice(start, start + ITEMS_PER_PAGE)
            };
        }

        function renderPagination(page, totalPages) {
            const container = document.getElementById('tablePagination');
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = `
                <button class="rounded-base border border-border px-3 py-1.5 text-sm ${page === 1 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-slate-50'}" ${page === 1 ? 'disabled' : ''} data-page="${page - 1}">Trước</button>
                <span class="text-sm text-text-muted">Trang ${page}/${totalPages}</span>
                <button class="rounded-base border border-border px-3 py-1.5 text-sm ${page === totalPages ? 'opacity-50 cursor-not-allowed' : 'hover:bg-slate-50'}" ${page === totalPages ? 'disabled' : ''} data-page="${page + 1}">Sau</button>
            `;

            container.querySelectorAll('button[data-page]').forEach((btn) => {
                btn.addEventListener('click', () => renderRows(Number(btn.dataset.page)));
            });
        }

        function renderRows(page) {
            const tbody = document.getElementById('buildingTableBody');
            const empty = document.getElementById('emptyState');
            const paged = paginate(buildingsCache, page);
            currentPage = paged.safePage;

            if (!paged.data.length) {
                tbody.innerHTML = '';
                empty.classList.remove('hidden');
                document.getElementById('tablePagination').innerHTML = '';
                return;
            }

            empty.classList.add('hidden');
            tbody.innerHTML = paged.data.map((b) => `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-4 py-3 text-text-muted font-mono text-xs">${b.id}</td>
                    <td class="px-4 py-3 font-medium">${escHtml(b.name)}</td>
                    <td class="px-4 py-3 text-text-muted">${Number(b.totalFloors) || 0}</td>
                    <td class="px-4 py-3 text-text-muted max-w-xs truncate" title="${escHtml(b.description || '')}">${escHtml(b.description || '-')}</td>
                    <td class="px-4 py-3 text-text-muted text-xs">${fmtDate(b.createdAt)}</td>
                    <td class="px-4 py-3 text-text-muted text-xs">${fmtDate(b.updatedAt)}</td>
                    <td class="px-4 py-3">
                        <div class="flex justify-end gap-1">
                            <button onclick="openEditModal(${b.id})" class="p-1.5 rounded-base text-text-muted hover:text-primary hover:bg-slate-100 transition-colors" aria-label="Sửa">Sửa</button>
                            <button onclick="openDeleteModal(${b.id})" class="p-1.5 rounded-base text-text-muted hover:text-danger hover:bg-red-50 transition-colors" aria-label="Xóa">Xóa</button>
                        </div>
                    </td>
                </tr>
            `).join('');

            renderPagination(currentPage, paged.totalPages);
        }

        async function loadBuildings() {
            const res = await fetch(API_BASE, { headers: authHeaders() });
            const data = await res.json();
            if (!res.ok) {
                throw new Error(data.message || 'Lỗi tải dữ liệu');
            }
            buildingsCache = Array.isArray(data.result) ? data.result : [];
            renderRows(1);
        }

        function openModal() {
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('buildingForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('nameError').classList.add('hidden');
            document.getElementById('floorsError').classList.add('hidden');
            document.getElementById('modalTitle').textContent = 'Thêm tòa nhà';
        }

        function openEditModal(id) {
            const b = buildingsCache.find((x) => x.id === id);
            if (!b) return;
            document.getElementById('modalTitle').textContent = 'Chỉnh sửa tòa nhà';
            document.getElementById('editId').value = id;
            document.getElementById('fieldName').value = b.name;
            document.getElementById('fieldFloors').value = b.totalFloors;
            document.getElementById('fieldDesc').value = b.description || '';
            openModal();
        }

        function openDeleteModal(id) {
            const b = buildingsCache.find((item) => item.id === id);
            if (!b) return;
            deleteTargetId = id;
            document.getElementById('deleteName').textContent = b.name;
            document.getElementById('deleteModal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            deleteTargetId = null;
            document.getElementById('deleteModal').classList.add('hidden');
        }

        function validateForm() {
            const name = document.getElementById('fieldName').value.trim();
            const floorsValue = document.getElementById('fieldFloors').value;
            const floors = Number(floorsValue);
            const nameErr = document.getElementById('nameError');
            const floorsErr = document.getElementById('floorsError');
            let valid = true;

            if (!name) {
                nameErr.textContent = 'Tên tòa nhà không được để trống.';
                nameErr.classList.remove('hidden');
                valid = false;
            } else {
                nameErr.classList.add('hidden');
            }

            if (!floorsValue || Number.isNaN(floors) || floors < 1 || floors > 99) {
                floorsErr.textContent = 'Số tầng phải là số nguyên từ 1 đến 99.';
                floorsErr.classList.remove('hidden');
                valid = false;
            } else {
                floorsErr.classList.add('hidden');
            }

            return valid;
        }

        document.getElementById('buildingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!validateForm()) return;

            const id = document.getElementById('editId').value;
            const payload = {
                name: document.getElementById('fieldName').value.trim(),
                totalFloors: Number(document.getElementById('fieldFloors').value),
                description: document.getElementById('fieldDesc').value.trim() || null
            };

            const isEdit = !!id;
            const url = isEdit ? `${API_BASE}/${id}` : API_BASE;
            const method = isEdit ? 'PUT' : 'POST';
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.textContent = 'Đang lưu...';

            try {
                const res = await fetch(url, {
                    method,
                    headers: authHeaders(),
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Lỗi lưu dữ liệu');

                showToast(isEdit ? 'Cập nhật tòa nhà thành công!' : 'Thêm tòa nhà thành công!');
                closeModal();
                await loadBuildings();
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Lưu';
            }
        });

        document.getElementById('deleteConfirm').addEventListener('click', async () => {
            if (!deleteTargetId) return;
            const btn = document.getElementById('deleteConfirm');
            btn.disabled = true;
            btn.textContent = 'Đang xóa...';

            try {
                const res = await fetch(`${API_BASE}/${deleteTargetId}`, {
                    method: 'DELETE',
                    headers: authHeaders()
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Lỗi xóa dữ liệu');

                showToast('Xóa tòa nhà thành công!');
                closeDeleteModal();
                await loadBuildings();
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Xóa';
            }
        });

        document.getElementById('btnAdd').addEventListener('click', () => {
            document.getElementById('modalTitle').textContent = 'Thêm tòa nhà';
            openModal();
        });
        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('btnCancel').addEventListener('click', closeModal);
        document.getElementById('modalBackdrop').addEventListener('click', closeModal);
        document.getElementById('deleteCancel').addEventListener('click', closeDeleteModal);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
                closeDeleteModal();
            }
        });

        (async () => {
            try {
                await ensureAdmin();
                await loadBuildings();
            } catch (error) {
                localStorage.removeItem('dormitory_access_token');
                window.location.href = '/login';
            }
        })();
    </script>
</body>

</html>
