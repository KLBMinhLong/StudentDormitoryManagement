<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTX - Báo hỏng cơ sở vật chất</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/ui/theme.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0EA5A5',
                        'primary-hover': '#0B8F8F',
                        secondary: '#3B82F6',
                        'bg-page': '#F8FAFC',
                        'bg-card': '#FFFFFF',
                        'text-main': '#0F172A',
                        'text-muted': '#475569',
                        border: '#E2E8F0',
                        success: '#16A34A',
                        warning: '#EAB308',
                        danger: '#EF4444'
                    },
                    boxShadow: { soft: '0 4px 12px rgba(15, 23, 42, 0.06)' },
                    borderRadius: { base: '12px' },
                    fontFamily: {
                        heading: ['Be Vietnam Pro', 'sans-serif'],
                        body: ['Inter', 'sans-serif']
                    }
                }
            }
        };
    </script>
</head>
<body class="font-body text-text-main bg-bg-page min-h-screen">
<div id="userLayout" class="user-layout max-w-[1200px] mx-auto px-4 py-4 md:py-6">
    <div id="userSidebarMount"></div>

<main class="user-content min-w-0">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Form Section -->
        <section class="md:col-span-1">
            <div class="rounded-base bg-bg-card border border-border shadow-soft p-6 sticky top-6">
                <div class="flex items-center gap-3 mb-4">
                    <div class="flex h-10 w-10 items-center justify-center rounded-full bg-teal-50 text-primary">
                        <i class="fa-solid fa-bullhorn"></i>
                    </div>
                    <h2 class="font-heading text-xl">Gửi yêu cầu mới</h2>
                </div>
                <form id="issueForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-text-muted mb-1">Mô tả vấn đề</label>
                        <textarea id="description" name="description" required rows="4" 
                            class="w-full rounded-base border border-border px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary h-32 resize-none"
                            placeholder="Ví dụ: Bóng đèn phòng bị cháy, vòi nước rò rỉ..."></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-text-muted mb-1">Mức độ ưu tiên</label>
                        <select id="priority" name="priority" required
                            class="w-full rounded-base border border-border bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
                            <option value="LOW">Thấp</option>
                            <option value="MEDIUM" selected>Trung bình</option>
                            <option value="HIGH">Cao (Khẩn cấp)</option>
                        </select>
                    </div>
                    <button type="submit" id="submitBtn"
                        class="w-full rounded-base bg-primary hover:bg-primary-hover text-white px-4 py-2.5 text-sm font-medium transition-colors shadow-sm inline-flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i>
                        Gửi yêu cầu
                    </button>
                </form>
            </div>
        </section>

        <!-- List Section -->
        <section class="md:col-span-2">
            <div class="rounded-base bg-bg-card border border-border shadow-soft p-6">
                <div class="flex items-center gap-3 mb-4">
                    <div class="flex h-10 w-10 items-center justify-center rounded-full bg-blue-50 text-secondary">
                        <i class="fa-regular fa-clock"></i>
                    </div>
                    <h2 class="font-heading text-xl">Lịch sử yêu cầu</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="text-left text-text-muted border-b border-border">
                                <th class="pb-3 pr-4 font-medium">Ngày gửi</th>
                                <th class="pb-3 pr-4 font-medium">Mô tả</th>
                                <th class="pb-3 pr-4 font-medium">Ưu tiên</th>
                                <th class="pb-3 font-medium">Trạng thái</th>
                            </tr>
                        </thead>
                        <tbody id="issueListBody">
                            <!-- Data will be loaded here -->
                            <tr>
                                <td colspan="4" class="py-10 text-center text-text-muted italic">Đang tải dữ liệu...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</main>
</div>

<script src="/ui/user-sidebar.js"></script>

<div id="toast" class="hidden fixed bottom-6 right-6 z-50 animate-bounce">
    <div id="toastContent" class="rounded-base shadow-lg px-6 py-3 text-white text-sm font-medium border border-transparent">
        Message here
    </div>
</div>

<script>
    const token = localStorage.getItem('dormitory_access_token');
    if (!token) window.location.href = '/login.html';

    const issueForm = document.getElementById('issueForm');
    const issueListBody = document.getElementById('issueListBody');
    const toast = document.getElementById('toast');
    const toastContent = document.getElementById('toastContent');

    if (window.UserSidebar) {
        window.UserSidebar.mount({ active: 'issues', authenticated: true, caption: 'Báo hỏng' });
    }

    function showToast(message, type = 'success') {
        toastContent.textContent = message;
        if (type === 'error') {
            toastContent.className = 'rounded-base shadow-lg px-6 py-3 text-white text-sm font-medium bg-danger';
        } else {
            toastContent.className = 'rounded-base shadow-lg px-6 py-3 text-white text-sm font-medium bg-success';
        }
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    function getPriorityLabel(priority) {
        switch(priority) {
            case 'LOW': return '<span class="text-slate-500">Thấp</span>';
            case 'MEDIUM': return '<span class="text-warning font-medium">Trung bình</span>';
            case 'HIGH': return '<span class="text-danger font-bold">Cao</span>';
            default: return priority;
        }
    }

    function getStatusLabel(status) {
        switch(status) {
            case 'PENDING': return '<span class="px-2 py-1 rounded-full bg-slate-100 text-slate-600 text-xs">Tiếp nhận</span>';
            case 'IN_PROGRESS': return '<span class="px-2 py-1 rounded-full bg-blue-100 text-blue-600 text-xs">Đang sửa</span>';
            case 'RESOLVED': return '<span class="px-2 py-1 rounded-full bg-green-100 text-green-600 text-xs">Hoàn thành</span>';
            default: return status;
        }
    }

    async function loadIssues() {
        try {
            const response = await fetch('/api/v1/issues/me', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            
            if (data.result && data.result.length > 0) {
                issueListBody.innerHTML = data.result.map(issue => `
                    <tr class="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                        <td class="py-3 pr-4 text-xs text-text-muted">${new Date(issue.createdAt).toLocaleDateString('vi-VN')}</td>
                        <td class="py-3 pr-4">${issue.description}</td>
                        <td class="py-3 pr-4 text-xs">${getPriorityLabel(issue.priority)}</td>
                        <td class="py-3">${getStatusLabel(issue.status)}</td>
                    </tr>
                `).join('');
            } else {
                issueListBody.innerHTML = `<tr><td colspan="4" class="py-10 text-center text-text-muted italic">Bạn chưa gửi yêu cầu nào.</td></tr>`;
            }
        } catch (error) {
            console.error('Error:', error);
            issueListBody.innerHTML = `<tr><td colspan="4" class="py-10 text-center text-danger">Lỗi khi tải dữ liệu.</td></tr>`;
        }
    }

    issueForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Đang gửi...';

        const formData = {
            description: document.getElementById('description').value,
            priority: document.getElementById('priority').value
        };

        try {
            const response = await fetch('/api/v1/issues', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(formData)
            });

            const data = await response.json();
            if (response.ok) {
                showToast('Gửi yêu cầu thành công!');
                issueForm.reset();
                loadIssues();
            } else {
                showToast(data.message || 'Lỗi khi gửi yêu cầu.', 'error');
            }
        } catch (error) {
            showToast('Lỗi kết nối máy chủ.', 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Gửi yêu cầu';
        }
    });

    loadIssues();
</script>
</body>
</html>
