<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin cá nhân - Ký Túc Xá</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/ui/theme.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0EA5A5',
                        'primary-hover': '#0B8F8F',
                        secondary: '#3B82F6',
                        'bg-page': '#F8FAFC',
                        'bg-card': '#FFFFFF',
                        'text-main': '#0F172A',
                        'text-muted': '#475569',
                        border: '#E2E8F0',
                        success: '#16A34A',
                        danger: '#DC2626'
                    },
                    boxShadow: { soft: '0 4px 12px rgba(15, 23, 42, 0.06)' },
                    borderRadius: { base: '12px' },
                    fontFamily: {
                        heading: ['Be Vietnam Pro', 'sans-serif'],
                        body: ['Inter', 'sans-serif']
                    }
                }
            }
        };
    </script>
</head>

<body class="font-body text-text-main bg-bg-page min-h-screen">
<header class="border-b border-border bg-bg-card">
    <div class="max-w-[1200px] mx-auto px-4 py-4 flex items-center justify-between gap-4">
        <div>
            <p class="text-xs text-text-muted">Khu vực sinh viên</p>
            <h1 class="font-heading text-xl">Quản lý thông tin cá nhân</h1>
        </div>
        <nav class="flex items-center gap-2">
            <a href="/home.html" class="rounded-base border border-border px-3 py-2 text-sm font-medium hover:bg-slate-50">Trở về Trang chủ</a>
            <a href="/user/contracts.html" class="rounded-base border border-border px-3 py-2 text-sm font-medium hover:bg-slate-50">Hợp đồng của tôi</a>
            <button id="logoutBtn" class="rounded-base bg-primary hover:bg-primary-hover text-white px-4 py-2 text-sm font-medium transition-colors">Đăng xuất</button>
        </nav>
    </div>
</header>

<main class="max-w-[800px] mx-auto px-4 py-8">
    <div id="message" class="hidden mb-6 rounded-base px-4 py-3 text-sm"></div>

    <section class="bg-bg-card rounded-base shadow-soft border border-border p-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="font-heading text-2xl">Hồ sơ sinh viên</h2>
            <button onclick="openPasswordModal()" class="rounded-base bg-slate-100 hover:bg-slate-200 text-text-main border border-border px-4 py-2 text-sm font-medium transition-colors">Đổi mật khẩu</button>
        </div>

        <form id="profileForm">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="col-span-1 flex flex-col items-center gap-4">
                    <img id="profileAvatar" src="/ui/avatar-default.png" onerror="this.src='/ui/avatar-default.png'" alt="Avatar" class="w-40 h-40 rounded-full border-2 border-border object-cover bg-slate-100">
                    <div class="flex flex-col items-center gap-2 w-full mt-2">
                        <input type="file" id="myAvatarInput" accept="image/*" class="text-xs w-full max-w-[200px] border border-border p-1 rounded-base">
                        <button type="button" onclick="uploadMyAvatar()" class="rounded-base bg-slate-100 hover:bg-slate-200 text-text-main border border-border px-3 py-1.5 text-xs font-medium w-full max-w-[200px]">Tải ảnh mới lên</button>
                    </div>
                </div>

                <div class="col-span-1 md:col-span-2 grid grid-cols-1 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-text-muted mb-1">Họ và tên</label>
                        <input type="text" id="meFullName" readonly class="w-full border border-border rounded-base px-4 py-2 text-sm bg-slate-50 outline-none text-text-muted">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-text-muted mb-1">Mã sinh viên</label>
                        <input type="text" id="meStudentCode" readonly class="w-full border border-border rounded-base px-4 py-2 text-sm bg-slate-50 outline-none text-text-muted">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-text-muted mb-1">CCCD</label>
                        <input type="text" id="meCccd" readonly class="w-full border border-border rounded-base px-4 py-2 text-sm bg-slate-50 outline-none text-text-muted">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mt-8 pt-8 border-t border-border">
                <p class="col-span-1 md:col-span-2 text-sm font-medium text-text-main mb-2">Thông tin liên hệ</p>
                <div>
                    <label class="block text-sm font-medium text-text-muted mb-1">Ngày sinh</label>
                    <input type="date" id="meDateOfBirth" class="w-full border border-border rounded-base px-4 py-2 text-sm focus:outline-none focus:border-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium text-text-muted mb-1">Giới tính</label>
                    <select id="meGender" class="w-full border border-border rounded-base px-4 py-2 text-sm focus:outline-none focus:border-primary">
                        <option value="Nam">Nam</option>
                        <option value="Nữ">Nữ</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-text-muted mb-1">Số điện thoại</label>
                    <input type="text" id="mePhone" class="w-full border border-border rounded-base px-4 py-2 text-sm focus:outline-none focus:border-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium text-text-muted mb-1">Email cá nhân</label>
                    <input type="email" id="meEmail" class="w-full border border-border rounded-base px-4 py-2 text-sm focus:outline-none focus:border-primary">
                </div>
            </div>

            <div class="mt-8 flex justify-end gap-3 pt-6 border-t border-border">
                <button type="button" onclick="window.location.href='/home.html'" class="rounded-base border border-border px-6 py-2 text-sm font-medium hover:bg-slate-50">Hủy</button>
                <button type="submit" class="rounded-base bg-primary hover:bg-primary-hover text-white px-6 py-2 text-sm font-medium">Lưu thay đổi</button>
            </div>
        </form>
    </section>

    <section id="residenceHistorySection" class="bg-bg-card rounded-base shadow-soft border border-border p-8 mt-6">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-5">
            <div>
                <h2 class="font-heading text-2xl">Timeline lịch sử cư trú</h2>
                <p id="historySummary" class="text-sm text-text-muted mt-1">Đang tải lịch sử nội trú...</p>
            </div>
            <div class="w-full md:w-auto flex items-center gap-2">
                <input
                    id="historyKeyword"
                    type="text"
                    placeholder="Tìm theo tòa nhà hoặc phòng"
                    class="w-full md:w-72 border border-border rounded-base px-3 py-2 text-sm focus:outline-none focus:border-primary"
                >
                <button
                    id="historySearchBtn"
                    type="button"
                    class="rounded-base bg-primary hover:bg-primary-hover text-white px-4 py-2 text-sm font-medium"
                >
                    Tìm
                </button>
            </div>
        </div>

        <ol id="historyTimeline" class="space-y-4"></ol>

        <div class="mt-6 flex flex-col md:flex-row md:items-center md:justify-between gap-3 border-t border-border pt-4">
            <p id="historyPagingText" class="text-sm text-text-muted">Hiển thị 0-0 trên tổng số 0 kết quả</p>
            <div class="flex items-center gap-2">
                <button
                    id="historyPrevBtn"
                    type="button"
                    class="rounded-base border border-border px-4 py-2 text-sm font-medium hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    Trước
                </button>
                <span id="historyPageInfo" class="text-sm text-text-muted min-w-[96px] text-center">Trang 1/1</span>
                <button
                    id="historyNextBtn"
                    type="button"
                    class="rounded-base border border-border px-4 py-2 text-sm font-medium hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    Sau
                </button>
            </div>
        </div>
    </section>
</main>

<div id="passwordModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
    <div class="bg-bg-card rounded-base w-full max-w-md p-6 shadow-soft mx-4">
        <h3 class="font-heading text-xl mb-4">Đổi mật khẩu</h3>
        <form id="passwordForm">
            <div class="grid grid-cols-1 gap-4">
                <div>
                    <label class="block text-sm font-medium text-text-muted mb-1">Mật khẩu cũ *</label>
                    <input type="password" id="oldPassword" required class="w-full border border-border rounded-base px-3 py-2 text-sm focus:outline-none focus:border-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium text-text-muted mb-1">Mật khẩu mới *</label>
                    <input type="password" id="newPassword" required class="w-full border border-border rounded-base px-3 py-2 text-sm focus:outline-none focus:border-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium text-text-muted mb-1">Xác nhận mật khẩu mới *</label>
                    <input type="password" id="confirmPassword" required class="w-full border border-border rounded-base px-3 py-2 text-sm focus:outline-none focus:border-primary">
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-2">
                <button type="button" onclick="closePasswordModal()" class="rounded-base border border-border px-4 py-2 text-sm font-medium hover:bg-slate-50">Hủy</button>
                <button type="submit" class="rounded-base bg-primary hover:bg-primary-hover text-white px-4 py-2 text-sm font-medium">Xác nhận</button>
            </div>
        </form>
    </div>
</div>

<script>
    const token = localStorage.getItem('dormitory_access_token');
    const message = document.getElementById('message');
    const profileForm = document.getElementById('profileForm');
    const passwordModal = document.getElementById('passwordModal');
    const passwordForm = document.getElementById('passwordForm');
    const historySection = document.getElementById('residenceHistorySection');
    const historyTimeline = document.getElementById('historyTimeline');
    const historySummary = document.getElementById('historySummary');
    const historyKeywordInput = document.getElementById('historyKeyword');
    const historySearchBtn = document.getElementById('historySearchBtn');
    const historyPagingText = document.getElementById('historyPagingText');
    const historyPageInfo = document.getElementById('historyPageInfo');
    const historyPrevBtn = document.getElementById('historyPrevBtn');
    const historyNextBtn = document.getElementById('historyNextBtn');

    const historyState = {
        page: 0,
        size: 5,
        sortBy: 'startDate',
        direction: 'desc',
        keyword: ''
    };

    if (!token) {
        window.location.href = '/login.html';
    }

    function showMessage(type, text) {
        message.className = 'mb-6 rounded-base px-4 py-3 text-sm block';
        if (type === 'error') {
            message.classList.add('bg-red-50', 'text-danger', 'border', 'border-red-100');
        } else {
            message.classList.add('bg-green-50', 'text-success', 'border', 'border-green-100');
        }
        message.textContent = text;
        setTimeout(() => { message.classList.add('hidden'); }, 3000);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function formatDate(value) {
        if (!value) return 'Chưa cập nhật';
        const dt = new Date(value);
        if (Number.isNaN(dt.getTime())) return 'Chưa cập nhật';
        return dt.toLocaleDateString('vi-VN');
    }

    function getStatusChip(status) {
        const normalized = (status || '').toUpperCase();
        if (normalized === 'ACTIVE') {
            return { label: 'Đang nội trú', classes: 'bg-green-50 text-success border border-green-100' };
        }
        if (normalized === 'EXPIRED') {
            return { label: 'Đã kết thúc', classes: 'bg-slate-100 text-slate-700 border border-slate-200' };
        }
        if (normalized === 'CANCELLED') {
            return { label: 'Đã hủy', classes: 'bg-red-50 text-danger border border-red-100' };
        }
        return { label: status || 'Không xác định', classes: 'bg-amber-50 text-amber-700 border border-amber-100' };
    }

    function renderResidenceHistory(items) {
        if (!Array.isArray(items) || items.length === 0) {
            historyTimeline.innerHTML = `
                <li class="rounded-base border border-dashed border-border bg-slate-50 px-4 py-5 text-sm text-text-muted">
                    Chưa có dữ liệu lịch sử cư trú phù hợp.
                </li>
            `;
            return;
        }

        historyTimeline.innerHTML = items.map((item) => {
            const statusChip = getStatusChip(item.status);
            const from = formatDate(item.startDate);
            const to = formatDate(item.endDate);
            const duration = item.durationMonths ? `${item.durationMonths} tháng` : 'Không xác định';
            const location = `${item.buildingName || 'Tòa chưa xác định'} - Phòng ${item.roomNumber || '-'} - Giường ${item.bedNumber ?? '-'}`;

            return `
                <li class="relative pl-8">
                    <span class="absolute left-0 top-2.5 h-3 w-3 rounded-full bg-primary"></span>
                    <div class="absolute left-[5px] top-6 bottom-[-20px] w-[2px] bg-border"></div>
                    <article class="rounded-base border border-border bg-white p-4 shadow-soft">
                        <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-3">
                            <div>
                                <p class="font-semibold text-sm text-text-main">${location}</p>
                                <p class="text-sm text-text-muted mt-1">Thời gian ở: ${from} - ${to}</p>
                                <p class="text-xs text-text-muted mt-1">Thời hạn hợp đồng: ${duration}</p>
                            </div>
                            <span class="inline-flex w-fit rounded-full px-3 py-1 text-xs font-medium ${statusChip.classes}">${statusChip.label}</span>
                        </div>
                    </article>
                </li>
            `;
        }).join('');
    }

    function renderResidencePaging(meta) {
        const total = Number(meta.totalElements || 0);
        const pageNo = Number(meta.pageNo || 0);
        const pageSize = Number(meta.pageSize || historyState.size);
        const totalPages = Number(meta.totalPages || 0);

        const start = total === 0 ? 0 : pageNo * pageSize + 1;
        const end = total === 0 ? 0 : Math.min((pageNo + 1) * pageSize, total);

        historyPagingText.textContent = `Hiển thị ${start}-${end} trên tổng số ${total} kết quả`;
        historyPageInfo.textContent = `Trang ${totalPages === 0 ? 0 : pageNo + 1}/${totalPages}`;

        historyPrevBtn.disabled = pageNo <= 0;
        historyNextBtn.disabled = totalPages === 0 || pageNo >= totalPages - 1;
    }

    async function loadResidenceHistory() {
        historyTimeline.innerHTML = `
            <li class="rounded-base border border-dashed border-border bg-slate-50 px-4 py-5 text-sm text-text-muted">
                Đang tải dữ liệu lịch sử nội trú...
            </li>
        `;

        const params = new URLSearchParams({
            page: String(historyState.page),
            size: String(historyState.size),
            sortBy: historyState.sortBy,
            direction: historyState.direction
        });

        if (historyState.keyword) {
            params.set('keyword', historyState.keyword);
        }

        try {
            const response = await fetch(`/api/v1/students/me/residence-history?${params.toString()}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || 'Không tải được lịch sử nội trú.');
            }

            const result = data.result || {};
            const rows = Array.isArray(result.content) ? result.content : [];
            historySummary.textContent = rows.length > 0
                ? 'Danh sách các lần đã ở theo thứ tự mới nhất trước.'
                : 'Chưa có lịch sử cư trú để hiển thị.';
            renderResidenceHistory(rows);
            renderResidencePaging(result);
        } catch (error) {
            historySummary.textContent = 'Không tải được dữ liệu lịch sử nội trú.';
            historyTimeline.innerHTML = `
                <li class="rounded-base border border-dashed border-red-200 bg-red-50 px-4 py-5 text-sm text-danger">
                    ${error.message || 'Có lỗi xảy ra khi tải lịch sử nội trú.'}
                </li>
            `;
            historyPagingText.textContent = 'Hiển thị 0-0 trên tổng số 0 kết quả';
            historyPageInfo.textContent = 'Trang 0/0';
            historyPrevBtn.disabled = true;
            historyNextBtn.disabled = true;
        }
    }

    historySearchBtn.addEventListener('click', () => {
        historyState.page = 0;
        historyState.keyword = (historyKeywordInput.value || '').trim();
        loadResidenceHistory();
    });

    historyKeywordInput.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter') return;
        event.preventDefault();
        historySearchBtn.click();
    });

    historyPrevBtn.addEventListener('click', () => {
        if (historyState.page <= 0) return;
        historyState.page -= 1;
        loadResidenceHistory();
    });

    historyNextBtn.addEventListener('click', () => {
        historyState.page += 1;
        loadResidenceHistory();
    });

    async function loadProfile() {
        try {
            const response = await fetch('/api/v1/students/me', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();

            if (!response.ok) {
                showMessage('error', data.message || 'Không tải được hồ sơ sinh viên.');
                return;
            }

            const st = data.result;
            document.getElementById('profileAvatar').src = st.avatarUrl || '/ui/avatar-default.png';
            document.getElementById('meFullName').value = st.fullName;
            document.getElementById('meStudentCode').value = st.studentCode;
            document.getElementById('meCccd').value = st.cccd;
            document.getElementById('meDateOfBirth').value = st.dateOfBirth || '';
            document.getElementById('meGender').value = st.gender || 'Nam';
            document.getElementById('mePhone').value = st.phone || '';
            document.getElementById('meEmail').value = st.email || '';
        } catch (error) {
            showMessage('error', 'Không thể kết nối hệ thống để tải hồ sơ.');
        }
    }

    profileForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            dateOfBirth: document.getElementById('meDateOfBirth').value || null,
            gender: document.getElementById('meGender').value,
            phone: document.getElementById('mePhone').value,
            email: document.getElementById('meEmail').value
        };

        try {
            const response = await fetch('/api/v1/students/me', {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const data = await response.json();
                throw new Error(data.message || 'Cập nhật thất bại');
            }

            showMessage('success', 'Cập nhật thông tin thành công');
        } catch (error) {
            showMessage('error', error.message);
        }
    });

    async function uploadMyAvatar() {
        const fileInput = document.getElementById('myAvatarInput');

        if (fileInput.files.length === 0) {
            showMessage('error', 'Vui lòng chọn một file ảnh.');
            return;
        }

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        try {
            const response = await fetch('/api/v1/students/me/avatar', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`
                },
                body: formData
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.message || 'Lỗi tải ảnh');

            document.getElementById('profileAvatar').src = data.result;
            showMessage('success', 'Đổi ảnh đại diện thành công');
            fileInput.value = '';
        } catch (error) {
            showMessage('error', error.message);
        }
    }

    function openPasswordModal() {
        passwordForm.reset();
        passwordModal.classList.remove('hidden');
    }

    function closePasswordModal() {
        passwordModal.classList.add('hidden');
    }

    passwordForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const oldPassword = document.getElementById('oldPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (newPassword !== confirmPassword) {
            alert('Mật khẩu xác nhận không khớp!');
            return;
        }

        try {
            const response = await fetch('/api/v1/students/me/password', {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ oldPassword, newPassword })
            });

            if (!response.ok) {
                const data = await response.json();
                throw new Error(data.message || 'Đổi mật khẩu thất bại');
            }

            showMessage('success', 'Đổi mật khẩu thành công. Vui lòng đăng nhập lại.');
            closePasswordModal();
            setTimeout(() => {
                localStorage.removeItem('dormitory_access_token');
                window.location.href = '/login.html';
            }, 2000);
        } catch (error) {
            alert(error.message);
        }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('dormitory_access_token');
        window.location.href = '/login.html';
    });

    Promise.all([loadProfile(), loadResidenceHistory()]);
</script>
</body>

</html>
