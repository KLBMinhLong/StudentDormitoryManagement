<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ký Túc Xá Sinh Viên - Đăng ký</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/ui/theme.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0EA5A5',
                        'primary-hover': '#0B8F8F',
                        secondary: '#3B82F6',
                        'bg-page': '#F8FAFC',
                        'bg-card': '#FFFFFF',
                        'text-main': '#0F172A',
                        'text-muted': '#475569',
                        border: '#E2E8F0',
                        danger: '#DC2626',
                        success: '#16A34A'
                    },
                    boxShadow: { soft: '0 4px 12px rgba(15, 23, 42, 0.06)' },
                    borderRadius: { base: '12px' },
                    fontFamily: {
                        heading: ['Be Vietnam Pro', 'sans-serif'],
                        body: ['Inter', 'sans-serif']
                    }
                }
            }
        };
    </script>
</head>

<body class="font-body text-text-main bg-bg-page min-h-screen">
    <header class="bg-bg-card border-b border-border">
        <div class="max-w-[1200px] mx-auto px-4 py-4 flex items-center justify-between">
            <h1 class="font-heading text-lg">Ký Túc Xá Sinh Viên</h1>
            <nav class="flex items-center gap-2">
                <a href="/login" class="px-3 py-2 rounded-base border border-border text-sm text-text-main hover:bg-slate-50">Đăng nhập</a>
                <a href="/register" class="px-3 py-2 rounded-base border border-border text-sm bg-primary text-white">Đăng ký</a>
            </nav>
        </div>
    </header>

    <main class="max-w-[1200px] mx-auto px-4 py-8">
        <section class="max-w-md mx-auto rounded-base border border-border bg-bg-card shadow-soft p-6">
            <h2 class="font-heading text-2xl">Đăng ký tài khoản Sinh viên</h2>
            <p class="text-text-muted mt-2 text-sm">Điền thông tin bên dưới để tạo tài khoản mới.</p>

            <form id="registerForm" class="mt-6 space-y-4" novalidate>
                <div>
                    <label for="fullName" class="block text-sm font-medium mb-2">Họ và tên</label>
                    <input id="fullName" type="text" required class="w-full rounded-base border border-border px-4 py-3" placeholder="Nguyễn Văn A">
                </div>
                <div>
                    <label for="studentCode" class="block text-sm font-medium mb-2">Mã sinh viên</label>
                    <input id="studentCode" type="text" required class="w-full rounded-base border border-border px-4 py-3" placeholder="SV2026001">
                </div>
                <div>
                    <label for="cccd" class="block text-sm font-medium mb-2">CCCD</label>
                    <input id="cccd" type="text" required class="w-full rounded-base border border-border px-4 py-3" placeholder="079204000001">
                </div>
                <div>
                    <label for="username" class="block text-sm font-medium mb-2">Tên đăng nhập</label>
                    <input id="username" type="text" required class="w-full rounded-base border border-border px-4 py-3" placeholder="student_new">
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium mb-2">Email</label>
                    <input id="email" type="email" class="w-full rounded-base border border-border px-4 py-3" placeholder="student@example.com">
                </div>
                <div>
                    <label for="phone" class="block text-sm font-medium mb-2">Số điện thoại</label>
                    <input id="phone" type="text" class="w-full rounded-base border border-border px-4 py-3" placeholder="09xxxxxxxx">
                </div>
                <div>
                    <label for="gender" class="block text-sm font-medium mb-2">Giới tính</label>
                    <select id="gender" class="w-full rounded-base border border-border px-4 py-3">
                        <option value="">Chọn giới tính</option>
                        <option value="Nam">Nam</option>
                        <option value="Nữ">Nữ</option>
                    </select>
                </div>
                <div>
                    <label for="dateOfBirth" class="block text-sm font-medium mb-2">Ngày sinh</label>
                    <input id="dateOfBirth" type="date" class="w-full rounded-base border border-border px-4 py-3">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium mb-2">Mật khẩu</label>
                    <input id="password" type="password" required class="w-full rounded-base border border-border px-4 py-3" placeholder="Nhập mật khẩu">
                </div>
                <div>
                    <label for="confirmPassword" class="block text-sm font-medium mb-2">Nhập lại mật khẩu</label>
                    <input id="confirmPassword" type="password" required class="w-full rounded-base border border-border px-4 py-3" placeholder="Nhập lại mật khẩu">
                </div>
                <button type="submit" class="w-full rounded-base bg-primary hover:bg-primary-hover text-white py-3 font-medium transition-colors">Đăng ký</button>
            </form>

            <p class="text-sm text-text-muted mt-4">Đã có tài khoản? <a href="/login" class="text-secondary font-medium">Đăng nhập</a></p>
            <div id="message" class="hidden mt-4 rounded-base px-4 py-3 text-sm"></div>
        </section>
    </main>

    <script>
        const token = localStorage.getItem('dormitory_access_token');
        if (token) {
            window.location.href = '/home';
        }

        const form = document.getElementById('registerForm');
        const message = document.getElementById('message');

        function showMessage(type, text) {
            message.className = 'mt-4 rounded-base px-4 py-3 text-sm';
            if (type === 'error') {
                message.classList.add('bg-red-50', 'text-danger', 'border', 'border-red-100');
            } else {
                message.classList.add('bg-green-50', 'text-success', 'border', 'border-green-100');
            }
            message.textContent = text;
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (password !== confirmPassword) {
                showMessage('error', 'Mật khẩu nhập lại không khớp.');
                return;
            }

            showMessage('success', 'Đang đăng ký...');

            const payload = {
                fullName: document.getElementById('fullName').value.trim(),
                studentCode: document.getElementById('studentCode').value.trim(),
                cccd: document.getElementById('cccd').value.trim(),
                username: document.getElementById('username').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                gender: document.getElementById('gender').value,
                dateOfBirth: document.getElementById('dateOfBirth').value || null,
                password
            };

            try {
                const response = await fetch('/api/v1/auth/register/student', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Đăng ký thất bại');
                }

                showMessage('success', 'Đăng ký thành công. Vui lòng chờ trong giây lát...');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 1800);
            } catch (error) {
                showMessage('error', error.message || 'Có lỗi xảy ra');
            }
        });
    </script>
</body>

</html>
