spring.profiles.active=dev
server.port=8081

spring.application.name=management

# SQL Server local connection settings
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=StudentDormitoryManagement;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# SQL logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Consistent JSON date-time format
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.mvc.format.date-time=yyyy-MM-dd HH:mm:ss

# Enable static resource mappings (default behavior)
spring.web.resources.add-mappings=true

# Scheduler settings
# Run invoice generation at 00:30 on day 10 of every month (for previous month M)
app.scheduler.zone=Asia/Ho_Chi_Minh
app.scheduler.invoice-generation.cron=0 30 0 10 * *

# PayOS default configuration (override in application-dev.properties)
app.payos.client-id=
app.payos.api-key=
app.payos.checksum-key=
app.payos.base-url=https://api-merchant.payos.vn
app.payos.return-url=http://localhost:8081/user/payment-return.html
app.payos.cancel-url=http://localhost:8081/user/payment-cancel.html
