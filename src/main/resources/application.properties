spring.profiles.active=dev
server.port=8081

spring.application.name=management

# SQL Server local connection (MSI\SQLEXPRESS01 port 61198 - SQL Server Authentication)
spring.datasource.url=jdbc:sqlserver://localhost:61198;databaseName=StudentOnline;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# SQL logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Consistent JSON date-time format
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.mvc.format.date-time=yyyy-MM-dd HH:mm:ss

# Enable static resource mappings (default behavior)
spring.web.resources.add-mappings=true

