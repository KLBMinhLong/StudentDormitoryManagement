server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:StudentDormitoryManagement}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF

spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.mvc.format.date-time=yyyy-MM-dd HH:mm:ss

spring.web.resources.add-mappings=true

app.scheduler.zone=Asia/Ho_Chi_Minh
app.scheduler.invoice-generation.cron=0 30 0 10 * *

app.seed.enabled=false

# JWT configuration required at startup (override in Railway variables when ready)
app.jwt.secret=${APP_JWT_SECRET:JWT_SECRET_KEY}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:43200000}

app.payos.client-id=${APP_PAYOS_CLIENT_ID:}
app.payos.api-key=${APP_PAYOS_API_KEY:}
app.payos.checksum-key=${APP_PAYOS_CHECKSUM_KEY:}
app.payos.base-url=${APP_PAYOS_BASE_URL:https://api-merchant.payos.vn}
app.payos.return-url=${APP_PAYOS_RETURN_URL:https://example.com/user/payment-return.html}
app.payos.cancel-url=${APP_PAYOS_CANCEL_URL:https://example.com/user/payment-cancel.html}
